<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4fd8">
<title>Nursing Theory Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff1f8; --bg2:#eaf6ff; --bg3:#f1ecff;
  --ink:#16224f; --muted:#5c6896; --card:#ffffffee; --line:#e4e8fb;
  --royal:#2f4fd8; --violet:#7b4bd6; --purple:#a05be0; --pink:#ff6fae; --sky:#5fc3f5; --gold:#f5b72b; --navy:#0f1b4d;
  --good:#1fae78; --goodbg:#e2f8ee; --bad:#e5486a; --badbg:#ffe6ec;
  --shadow:0 8px 24px rgba(47,79,216,.12);
}
:root[data-theme="dark"]{
  --bg1:#1a1040; --bg2:#0d1537; --bg3:#190f3d;
  --ink:#eef0ff; --muted:#a9b2e0; --card:#1a2250ee; --line:#2c3775;
  --good:#3ddc9b; --goodbg:#10382f; --bad:#ff7a96; --badbg:#401a2c;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#1a1040; --bg2:#0d1537; --bg3:#190f3d;
    --ink:#eef0ff; --muted:#a9b2e0; --card:#1a2250ee; --line:#2c3775;
    --good:#3ddc9b; --goodbg:#10382f; --bad:#ff7a96; --badbg:#401a2c;
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--ink); min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3)); background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;margin:0;letter-spacing:.2px}
button{font-family:inherit;color:inherit;cursor:pointer}
#floaters{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;bottom:-60px;opacity:.0;animation:floatUp linear infinite;filter:drop-shadow(0 4px 6px rgba(80,60,160,.18))}
@keyframes floatUp{
  0%{transform:translate3d(0,0,0) rotate(-8deg);opacity:0}
  10%{opacity:.55} 50%{transform:translate3d(28px,-55vh,0) rotate(8deg)}
  90%{opacity:.5} 100%{transform:translate3d(-20px,-115vh,0) rotate(-10deg);opacity:0}
}
@media (prefers-reduced-motion:reduce){.fl{animation:none;opacity:.25}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui;font-weight:700;font-size:22px;background:linear-gradient(90deg,var(--royal),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;width:42px;height:42px;font-size:19px;box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(6px);margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--royal),var(--violet) 60%,var(--pink));color:#fff;border:none;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#ffd86a88,transparent 70%)}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.lvl{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:20px;font-weight:600}
.small{font-size:13px;opacity:.92}
.xpbar{height:10px;background:#ffffff40;border-radius:99px;overflow:hidden;margin-top:10px;position:relative;z-index:1}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe28a);border-radius:99px;transition:width .5s}
.streak{background:#ffffff26;border-radius:16px;padding:8px 12px;text-align:center;min-width:76px}
.streak b{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:24px;display:block;line-height:1}
.quote{font-size:14px;margin-top:12px;position:relative;z-index:1;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.act{border:none;border-radius:20px;padding:14px 12px;text-align:left;color:#fff;box-shadow:var(--shadow);min-height:92px}
.act b{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:17px;display:block}
.act span{font-size:12.5px;opacity:.95}
.act.daily{background:linear-gradient(135deg,var(--gold),#ff9d57)}
.act.mix{background:linear-gradient(135deg,var(--sky),var(--royal))}
.sec{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:18px;margin:18px 4px 10px;color:var(--ink)}
.lesson{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.lesson .h{display:flex;gap:12px;align-items:center}
.lesson .em{font-size:30px;width:54px;height:54px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#ffe0f0,#e4e0ff);flex:none}
:root[data-theme="dark"] .lesson .em{background:linear-gradient(135deg,#3b1d5e,#1d2a6b)}
.lesson h3{font-size:16.5px;line-height:1.2}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--violet),var(--pink));border-radius:99px;transition:width .4s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#eef1ff;color:var(--royal)}
:root[data-theme="dark"] .chip{background:#243074;color:#cdd6ff}
.chip.gold{background:#fff3cf;color:#8a6200}
:root[data-theme="dark"] .chip.gold{background:#4a3a10;color:#ffd777}
.soon{border:2px dashed var(--violet);background:transparent;text-align:center;box-shadow:none}
.btn{border:none;border-radius:16px;padding:13px 18px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--royal),var(--violet));box-shadow:var(--shadow);width:100%}
.btn.alt{background:linear-gradient(135deg,var(--pink),var(--purple))}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ff9d57);color:#3a2600}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn+.btn{margin-top:10px}
.btn:active,.opt:active,.act:active,.lesson:active{transform:scale(.98)}
.back{border:none;background:none;font-weight:800;color:var(--royal);font-size:15px;padding:6px 0;margin-bottom:6px}
:root[data-theme="dark"] .back{color:#9fb3ff}
.recap li{margin:7px 0;line-height:1.4}
.recap ul{padding-left:20px;margin:8px 0 0}
.part{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.part:first-of-type{border-top:none}
.part .btn{width:auto;padding:10px 16px;font-size:14.5px}
.part .btn+.btn{margin:0 0 0 6px}
.qtop{position:sticky;top:0;z-index:5;padding:8px 0 10px;background:linear-gradient(var(--bg1),transparent)}
.qrow{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.timer{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:18px;color:var(--royal)}
.timer.low{color:var(--bad);animation:pulse 1s infinite}
:root[data-theme="dark"] .timer{color:#9fb3ff}
@keyframes pulse{50%{opacity:.5}}
.qtext{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:20px;line-height:1.3;font-weight:500;margin:8px 0 14px}
.slideref{font-size:12px;color:var(--muted);font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:10px;font-size:16px;line-height:1.35;font-weight:600}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef1ff;color:var(--royal);font-weight:800;font-size:14px}
:root[data-theme="dark"] .opt .l{background:#2b3680;color:#cdd6ff}
.opt.good{border-color:var(--good);background:var(--goodbg)} .opt.good .l{background:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:18px;padding:13px 14px;margin:6px 0 12px;font-size:15px;line-height:1.45}
.fb.good{background:var(--goodbg);border:1px solid var(--good)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb b{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:17px;display:block;margin-bottom:3px}
.sticky{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg2) 40%)}
.score{text-align:center}
.score .big{font-family:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:64px;font-weight:700;line-height:1;background:linear-gradient(90deg,var(--royal),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars{font-size:34px;letter-spacing:4px;margin:6px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:none}
.rev .a{color:var(--good);font-weight:800} .rev .w{color:var(--bad);font-weight:700}
.banner{background:#fff3cf;color:#6a4a00;border:1px solid #f3d27a;border-radius:16px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;font-weight:700}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
textarea{width:100%;min-height:110px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font-size:13px;font-family:ui-monospace,monospace}
.modal{position:fixed;inset:0;background:#0a0f3099;z-index:50;display:grid;place-items:end center}
.sheet{background:var(--bg2);color:var(--ink);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;z-index:60;font-size:14px}
.confetti{position:fixed;top:-30px;font-size:24px;z-index:40;animation:fall 2.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
</style>
</head>
<body>
<div id="floaters" aria-hidden="true"></div>
<div id="app"></div>
<script>document.write('<script src="quiz-data.js?t='+Date.now()+'"><\/script>')</script>
<script>
(function(){
"use strict";
var KEY='nursing-theory-foundations-quiz-v1';
var D=window.QUIZ_DATA;
var app=document.getElementById('app');
if(!D||!D.lessons){app.innerHTML='<div class="card"><h2>Oops</h2><p>The question file did not load. Check that <b>quiz-data.js</b> is in the same folder as this page, then refresh.</p></div>';return;}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ds(d){return (d||new Date()).toLocaleDateString('en-CA');}
function yest(){var d=new Date();d.setDate(d.getDate()-1);return ds(d);}
function fmt(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove();},2200);}

/* ---------- data lookups ---------- */
var QBY={},LBY={},ALL=[];
D.lessons.forEach(function(L){LBY[L.id]=L;L.questions.forEach(function(q){q.lesson=L.id;QBY[q.id]=q;ALL.push(q);});});
function partsOf(L){var n=L.questions.length,k=Math.max(1,Math.ceil(n/44)),out=[],start=0;
  for(var i=0;i<k;i++){var size=Math.floor(n/k)+(i<n%k?1:0);out.push(L.questions.slice(start,start+size));start+=size;}return out;}

/* ---------- storage ---------- */
var canSave=true;
function blank(){return {v:1,xp:0,streak:{count:0,last:'',best:0},qstats:{},lessons:{},unfinished:{},daily:{},theme:'auto',attempts:0};}
var S=blank();
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.v)S=Object.assign(blank(),p);}
  localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');}catch(e){canSave=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){canSave=false;}}
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist();}}catch(e){}

/* ---------- theme ---------- */
function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);}
applyTheme();

/* ---------- levels ---------- */
var LEVELS=[[0,'Student Nurse','🌱'],[100,'Care Cadet','💙'],[300,'Ward Star','⭐'],[700,'Theory Thinker','🧠'],[1300,'Clinical Champion','🏅'],[2200,'Nightingale Scholar','🕯️'],[3500,'Matron of Theory','👑']];
function level(xp){var i=0;for(var k=0;k<LEVELS.length;k++)if(xp>=LEVELS[k][0])i=k;var cur=LEVELS[i],nxt=LEVELS[i+1];
  return {name:cur[1],emoji:cur[2],pct:nxt?Math.round((xp-cur[0])/(nxt[0]-cur[0])*100):100,next:nxt?nxt[0]-xp:0,nextName:nxt?nxt[1]:''};}
var QUOTES=['Every question you answer makes you a safer, kinder nurse. 💙','Small steps every day build brilliant practitioners. ✨','You are learning to care for people. That is a big deal! 🩺','Revise a little, remember a lot. 🧠','Your future patients are lucky to have you. 💜','Mistakes are just practice for the real thing. 🌟','Consistency beats cramming. Keep your streak alive! 🔥','Believe in the nurse you are becoming. 👩‍⚕️'];
var CHEER=['Brilliant! 🌟','Spot on! 💙','You nailed it! ✨','Lovely work! 💜','Yes! Keep going! 🎉','Correct! 🩺'];
var TRY=['Not quite, but now you know! 💪','Close! Read the note below. 📘','Good try, learn it and move on! 🌱','That one is tricky, it will stick now. 💡'];

/* ---------- floating emojis ---------- */
(function(){var em=['🩺','💉','💊','🩹','🏥','🧬','👩‍⚕️','👨‍⚕️','🌡️','🧠','⭐','✨','💙','💜','🩷','📘','🕊️','🌸','🏅','🧪'],box=document.getElementById('floaters');
  for(var i=0;i<16;i++){var s=document.createElement('span');s.className='fl';s.textContent=em[i%em.length];
    s.style.left=(Math.random()*94)+'%';s.style.fontSize=(20+Math.random()*22)+'px';
    s.style.animationDuration=(16+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*30)+'s';box.appendChild(s);}})();

/* ---------- stats ---------- */
function streakNow(){var s=S.streak;return (s.last===ds()||s.last===yest())?s.count:0;}
function touchStreak(){var s=S.streak,t=ds();if(s.last===t)return;s.count=(s.last===yest())?s.count+1:1;s.last=t;if(s.count>s.best)s.best=s.count;}
function lessonProgress(L){var n=L.questions.length,got=0;L.questions.forEach(function(q){var st=S.qstats[q.id];if(st&&st.c>0)got++;});return Math.round(got/n*100);}
function lessonBest(L){var ls=S.lessons[L.id];if(!ls||!ls.parts)return null;var v=[];for(var k in ls.parts)v.push(ls.parts[k].best);return v.length?Math.round(v.reduce(function(a,b){return a+b;},0)/v.length):null;}
function lessonAttempts(L){var ls=S.lessons[L.id];if(!ls||!ls.parts)return 0;var n=0;for(var k in ls.parts)n+=ls.parts[k].attempts;return n;}

/* ---------- session ---------- */
var session=null,tick=null,lastResult=null,openReview=false;
function startSession(o){
  var ids=shuffle(o.qs.map(function(q){return q.id;}));
  var s={key:o.key,mode:o.mode,title:o.title,lessonId:o.lessonId||null,part:o.part||0,qids:ids,idx:0,ans:{},total:30*ids.length,left:30*ids.length,t:Date.now()};
  S.unfinished[o.key]=s;save();session=s;go('quiz');
}
function resumeSession(key){var s=S.unfinished[key];if(!s)return;session=s;go('quiz');}
function stopTick(){if(tick){clearInterval(tick);tick=null;}}
function startTick(){stopTick();var last=Date.now();tick=setInterval(function(){
  if(!session){stopTick();return;}
  var now=Date.now(),d=(now-last)/1000;last=now;if(d>5)d=1;
  session.left-=d;var el=document.getElementById('tm');
  if(session.left<=0){session.left=0;finish(true);return;}
  if(el){el.textContent=fmt(session.left);el.className='timer'+(session.left<30?' low':'');}
  save();},1000);}
function answer(i){
  var q=QBY[session.qids[session.idx]];if(session.ans[q.id]!==undefined)return;
  session.ans[q.id]=i;var ok=(i===q.a),st=S.qstats[q.id]||(S.qstats[q.id]={s:0,c:0,w:0,last:0});
  st.s++;if(ok){st.c++;st.last=1;S.xp+=10;}else{st.w++;st.last=0;}
  S.unfinished[session.key]=session;save();render();
}
function nextQ(){session.idx++;if(session.idx>=session.qids.length){finish(false);return;}S.unfinished[session.key]=session;save();window.scrollTo(0,0);render();}
function finish(timeUp){
  stopTick();var s=session,n=s.qids.length,correct=0,missed=[];
  s.qids.forEach(function(id){var q=QBY[id];if(s.ans[id]===q.a)correct++;else missed.push(id);});
  var pct=Math.round(correct/n*100),bonus=pct===100?30:(pct>=80?15:0);S.xp+=bonus;S.attempts++;
  touchStreak();
  if(s.mode==='lesson'){var ls=S.lessons[s.lessonId]||(S.lessons[s.lessonId]={parts:{}});var p=ls.parts[s.part]||(ls.parts[s.part]={best:0,attempts:0});p.attempts++;if(pct>p.best)p.best=pct;}
  if(s.mode==='daily'){S.daily[ds()]=pct;}
  delete S.unfinished[s.key];
  lastResult={title:s.title,mode:s.mode,lessonId:s.lessonId,part:s.part,n:n,correct:correct,pct:pct,missed:missed,ans:s.ans,bonus:bonus,timeUp:timeUp,used:s.total-s.left};
  S.last=lastResult;save();session=null;openReview=false;go('results');
  if(pct>=70)confetti();
}
function confetti(){var em=['🎉','💙','💜','🩷','⭐','🩺','✨','🏅'];for(var i=0;i<22;i++){var e=document.createElement('span');e.className='confetti';e.textContent=em[i%em.length];e.style.left=(Math.random()*95)+'vw';e.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(e);(function(x){setTimeout(function(){x.remove();},3600);})(e);}}

/* ---------- picks ---------- */
function dailyPick(){
  var sc=ALL.map(function(q){var st=S.qstats[q.id],w;
    if(!st)w=2+Math.random();else if(st.last===0)w=4+Math.random();else w=(st.w/(st.s||1))*3+Math.random()-st.c*.1;return {q:q,w:w};});
  sc.sort(function(a,b){return b.w-a.w;});return sc.slice(0,10).map(function(x){return x.q;});}
function mixPick(){return shuffle(ALL).slice(0,15);}

/* ---------- routing ---------- */
var view='home',arg=null;
function go(v,a){view=v;arg=a||null;var h='#'+v+(a?'/'+a:'');if(location.hash!==h){try{history.pushState(null,'',h);}catch(e){location.hash=h;}}render();window.scrollTo(0,0);}
window.addEventListener('popstate',function(){var h=location.hash.replace('#','').split('/');var v=h[0]||'home';
  if(v==='quiz'&&!session){v='home';}if(v==='results'&&!lastResult&&!S.last){v='home';}
  if(v==='quiz'&&session){stopTick();}
  view=v;arg=h[1]||null;render();});

/* ---------- views ---------- */
function render(){
  stopTick();
  if(view==='lesson')return vLesson();
  if(view==='quiz'&&session)return vQuiz();
  if(view==='results'){lastResult=lastResult||S.last;if(lastResult)return vResults();}
  view='home';vHome();
}
function topbar(){return '<div class="top"><div class="brand">🩺 Nursing Theory Quest</div><div><button class="iconbtn" id="bk" title="Backup and restore">💾</button> <button class="iconbtn" id="th" title="Light or dark">🌓</button></div></div>';}
function wireTop(){
  var th=document.getElementById('th'),bk=document.getElementById('bk');
  if(th)th.onclick=function(){var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');S.theme=cur==='dark'?'light':'dark';applyTheme();save();};
  if(bk)bk.onclick=backupSheet;
}
function vHome(){
  var lv=level(S.xp),sk=streakNow(),q=QUOTES[(new Date().getDate())%QUOTES.length];
  var h=topbar();
  if(!canSave)h+='<div class="banner">⚠️ Your browser is in private mode or blocking storage, so progress cannot be saved. Open this page in a normal tab to keep your scores.</div>';
  h+='<div class="card hero"><div class="row"><div><div class="lvl">'+lv.emoji+' '+esc(lv.name)+'</div><div class="small">'+S.xp+' XP'+(lv.next?' · '+lv.next+' to '+esc(lv.nextName):' · top level!')+'</div></div><div class="streak"><b>🔥 '+sk+'</b><span class="small">day streak</span></div></div><div class="xpbar"><i style="width:'+lv.pct+'%"></i></div><div class="quote">'+esc(q)+'</div></div>';
  var un=Object.keys(S.unfinished);
  if(un.length){h+='<div class="card"><h3 style="font-size:17px">⏳ Continue where you stopped</h3>';
    un.forEach(function(k){var s=S.unfinished[k];h+='<div class="resume"><div><b>'+esc(s.title)+'</b><div class="meta">Question '+(s.idx+1)+' of '+s.qids.length+' · '+fmt(s.left)+' left</div></div><button class="btn" style="width:auto;padding:9px 16px" data-res="'+esc(k)+'">Resume</button></div>';});
    h+='</div>';}
  var dk='daily-'+ds(),dd=S.daily[ds()];
  h+='<div class="actions"><button class="act daily" id="daily"><b>🌞 Daily check-in</b><span>'+(dd!==undefined?'Done today: '+dd+'% ✅ Tap to go again':'10 questions, weak spots first')+'</span></button><button class="act mix" id="mix"><b>🎲 Surprise mix</b><span>15 random questions from every lesson</span></button></div>';
  h+='<div class="sec">📚 Your lessons</div>';
  D.lessons.forEach(function(L){var pr=lessonProgress(L),b=lessonBest(L),at=lessonAttempts(L),np=partsOf(L).length;
    h+='<button class="lesson" data-l="'+L.id+'"><div class="h"><div class="em">'+L.emoji+'</div><div style="flex:1"><h3>Lesson '+L.n+': '+esc(L.title)+'</h3><div class="meta">'+L.questions.length+' questions · slides '+L.slides[0]+' to '+L.slides[1]+(np>1?' · '+np+' parts':'')+'</div></div></div><div class="bar"><i style="width:'+pr+'%"></i></div><div class="chips"><span class="chip">'+pr+'% mastered</span><span class="chip gold">'+(b===null?'No score yet':'Best '+b+'%')+'</span>'+(at?'<span class="chip">'+at+' attempt'+(at>1?'s':'')+'</span>':'')+'</div></button>';});
  h+='<div class="lesson soon" style="cursor:default"><div style="font-size:30px">🚀</div><h3>More lessons coming</h3><div class="meta">Send new slides and they will appear here. Your progress stays safe.</div></div>';
  app.innerHTML=h;wireTop();
  app.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){go('lesson',b.getAttribute('data-l'));};});
  app.querySelectorAll('[data-res]').forEach(function(b){b.onclick=function(){resumeSession(b.getAttribute('data-res'));};});
  document.getElementById('daily').onclick=function(){if(S.unfinished[dk]){resumeSession(dk);return;}startSession({key:dk,mode:'daily',title:'Daily check-in',qs:dailyPick()});};
  document.getElementById('mix').onclick=function(){if(S.unfinished.mix){resumeSession('mix');return;}startSession({key:'mix',mode:'mix',title:'Surprise mix',qs:mixPick()});};
}
function vLesson(){
  var L=LBY[arg];if(!L){go('home');return;}
  var parts=partsOf(L),h='<button class="back" id="bh">← All lessons</button>';
  h+='<div class="card hero"><div class="lvl">'+L.emoji+' Lesson '+L.n+': '+esc(L.title)+'</div><div class="small">'+L.questions.length+' questions · slides '+L.slides[0]+' to '+L.slides[1]+'</div></div>';
  h+='<div class="card recap"><h3>📝 Quick recap before you start</h3><ul>'+L.recap.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="card"><h3>'+(parts.length>1?'Choose a part':'Start the quiz')+'</h3><div class="meta">About 30 seconds per question. Your timer and answers are saved if you leave.</div><div style="margin-top:6px">';
  parts.forEach(function(pq,i){var key=L.id+'|p'+i,un=S.unfinished[key],ls=S.lessons[L.id],p=ls&&ls.parts&&ls.parts[i];
    h+='<div class="part"><div><b>'+(parts.length>1?'Part '+(i+1):'Full lesson')+'</b><div class="meta">'+pq.length+' questions'+(p?' · best '+p.best+'%':'')+(un?' · '+fmt(un.left)+' left':'')+'</div></div><div>'+(un?'<button class="btn" data-r="'+i+'">Resume</button><button class="btn ghost" data-s="'+i+'">Restart</button>':'<button class="btn" data-s="'+i+'">Start</button>')+'</div></div>';});
  h+='</div></div>';
  var weak=L.questions.filter(function(q){var st=S.qstats[q.id];return st&&st.last===0;});
  if(weak.length)h+='<button class="btn alt" id="weak">🎯 Practise my '+weak.length+' weak question'+(weak.length>1?'s':'')+'</button>';
  app.innerHTML=h;
  document.getElementById('bh').onclick=function(){go('home');};
  app.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-s');startSession({key:L.id+'|p'+i,mode:'lesson',lessonId:L.id,part:i,title:'Lesson '+L.n+(parts.length>1?' · Part '+(i+1):''),qs:parts[i]});};});
  app.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){resumeSession(L.id+'|p'+b.getAttribute('data-r'));};});
  var w=document.getElementById('weak');if(w)w.onclick=function(){startSession({key:'retry',mode:'retry',lessonId:L.id,title:'Weak spots · Lesson '+L.n,qs:weak});};
}
function vQuiz(){
  var s=session,q=QBY[s.qids[s.idx]],a=s.ans[q.id],done=a!==undefined,n=s.qids.length;
  var h='<div class="qtop"><div class="qrow"><span>'+esc(s.title)+' · '+(s.idx+1)+'/'+n+'</span><span class="timer'+(s.left<30?' low':'')+'" id="tm">'+fmt(s.left)+'</span></div><div class="bar"><i style="width:'+Math.round(s.idx/n*100)+'%"></i></div></div>';
  h+='<div class="card"><div class="slideref">📍 Slide '+q.s+'</div><div class="qtext">'+esc(q.q)+'</div>';
  q.o.forEach(function(o,i){var c='opt';if(done){if(i===q.a)c+=' good';else if(i===a)c+=' bad';}
    h+='<button class="'+c+'" data-o="'+i+'" '+(done?'disabled':'')+'><span class="l">'+'ABCD'[i]+'</span><span>'+esc(o)+'</span></button>';});
  if(done){var ok=a===q.a;h+='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?CHEER[s.idx%CHEER.length]:TRY[s.idx%TRY.length])+'</b>'+esc(q.e)+'</div>';}
  h+='</div>';
  if(done)h+='<div class="sticky"><button class="btn" id="nx">'+(s.idx+1>=n?'See my results 🎉':'Next question →')+'</button></div>';
  h+='<button class="back" id="ex" style="margin-top:8px">⏸ Pause and go home (progress is saved)</button>';
  app.innerHTML=h;
  app.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){answer(+b.getAttribute('data-o'));};});
  var nx=document.getElementById('nx');if(nx)nx.onclick=nextQ;
  document.getElementById('ex').onclick=function(){stopTick();session=null;go('home');};
  startTick();
}
function vResults(){
  var r=lastResult,stars=r.pct>=90?'⭐⭐⭐':r.pct>=70?'⭐⭐☆':r.pct>=50?'⭐☆☆':'☆☆☆';
  var msg=r.pct>=90?'Outstanding! You really know this. 👑':r.pct>=70?'Great job! Nearly there. 💙':r.pct>=50?'Good effort! Review and try again. 🌱':'Every nurse starts somewhere. Review and go again! 💪';
  var h='<div class="card score"><div class="meta">'+esc(r.title)+(r.timeUp?' · ⏰ time was up':'')+'</div><div class="big">'+r.pct+'%</div><div class="stars">'+stars+'</div><b>'+r.correct+' of '+r.n+' correct</b><div class="meta">'+msg+'<br>Time used: '+fmt(r.used)+(r.bonus?' · +'+r.bonus+' bonus XP':'')+'</div></div>';
  if(r.missed.length)h+='<button class="btn alt" id="rt">🔁 Retry the '+r.missed.length+' I missed</button><button class="btn ghost" id="rv">'+(openReview?'Hide':'Review')+' wrong answers</button>';
  else h+='<div class="card score"><b>🎉 Perfect! Nothing to review.</b></div>';
  if(openReview&&r.missed.length){h+='<div class="card" style="margin-top:12px">';
    r.missed.forEach(function(id){var q=QBY[id],a=r.ans[id];h+='<div class="rev"><div class="slideref">📍 Slide '+q.s+'</div><b>'+esc(q.q)+'</b><div class="w">'+(a===undefined?'Not answered':'Your answer: '+esc(q.o[a]))+'</div><div class="a">Correct: '+esc(q.o[q.a])+'</div><div class="meta">'+esc(q.e)+'</div></div>';});h+='</div>';}
  h+='<div style="margin-top:12px">'+(r.lessonId?'<button class="btn ghost" id="bl">Back to lesson</button>':'')+'<button class="btn" id="bh">🏠 Home</button></div>';
  app.innerHTML=h;
  var rt=document.getElementById('rt');if(rt)rt.onclick=function(){startSession({key:'retry',mode:'retry',lessonId:r.lessonId,title:'Retry · '+r.title,qs:r.missed.map(function(id){return QBY[id];})});};
  var rv=document.getElementById('rv');if(rv)rv.onclick=function(){openReview=!openReview;vResults();};
  var bl=document.getElementById('bl');if(bl)bl.onclick=function(){go('lesson',r.lessonId);};
  document.getElementById('bh').onclick=function(){go('home');};
}

/* ---------- backup and restore ---------- */
function makeCode(){var o=Object.assign({},S);delete o.last;return 'NTQ1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function readCode(c){c=(c||'').trim();if(c.indexOf('NTQ1.')!==0)throw new Error('bad');var o=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));if(!o||o.v!==1||typeof o.qstats!=='object')throw new Error('bad');return o;}
function backupSheet(){
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="sheet"><h2>💾 Backup and restore</h2><p class="meta">Copy this code and keep it safe. Paste it on another phone to bring your progress across.</p><textarea id="bc" readonly></textarea><button class="btn" id="cp">Copy my backup code</button><p class="meta" style="margin-top:16px">Restore from a code (this replaces progress on this phone):</p><textarea id="rc" placeholder="Paste your code here"></textarea><button class="btn alt" id="rs">Restore progress</button><button class="btn ghost" id="cl">Close</button></div>';
  document.body.appendChild(m);
  var bc=m.querySelector('#bc');bc.value=makeCode();
  m.querySelector('#cp').onclick=function(){bc.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}if(navigator.clipboard){navigator.clipboard.writeText(bc.value).then(function(){toast('Copied! 💙');},function(){toast(ok?'Copied! 💙':'Select the text and copy it');});}else toast(ok?'Copied! 💙':'Select the text and copy it');};
  m.querySelector('#rs').onclick=function(){try{var o=readCode(m.querySelector('#rc').value);if(!confirm('Replace the progress on this phone with the backup?'))return;S=Object.assign(blank(),o);save();applyTheme();m.remove();session=null;toast('Progress restored ✅');go('home');}catch(e){toast('That code does not look right');}};
  m.querySelector('#cl').onclick=function(){m.remove();};
  m.onclick=function(e){if(e.target===m)m.remove();};
}

/* ---------- boot ---------- */
(function(){var h=location.hash.replace('#','').split('/');view=h[0]||'home';arg=h[1]||null;if(view==='quiz'||view==='results')view='home';
  window.__ntq={S:function(){return S;},go:go};render();})();
})();
</script>
