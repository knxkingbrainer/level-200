<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c4dff">
<title>NURS 251 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7fb; --card:#ffffff; --ink:#2a2140; --muted:#6f6688; --line:#efe3f1;
  --pink:#e8559a; --pink-soft:#ffe3f0; --blue:#6cabdd; --blue-soft:#e1f0fb; --purple:#7c4dff; --purple-soft:#ece5ff;
  --ok:#1f9d6b; --ok-soft:#dcf6ea; --bad:#d6405a; --bad-soft:#ffe1e6; --shadow:0 6px 24px rgba(124,77,255,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17122a; --card:#221b3d; --ink:#f3eefc; --muted:#b3a8d1; --line:#35295a;
  --pink-soft:#4a2144; --blue-soft:#1d3550; --purple-soft:#2f2561; --ok-soft:#14392d; --bad-soft:#4a1d2a; --shadow:0 6px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#17122a; --card:#221b3d; --ink:#f3eefc; --muted:#b3a8d1; --line:#35295a;
  --pink-soft:#4a2144; --blue-soft:#1d3550; --purple-soft:#2f2561; --ok-soft:#14392d; --bad-soft:#4a1d2a; --shadow:0 6px 24px rgba(0,0,0,.35);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--purple));display:grid;place-items:center;font-size:20px;color:#fff}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;font-size:18px}
.hero{background:linear-gradient(135deg,var(--pink) 0%,var(--purple) 60%,var(--blue) 120%);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hero h2{font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{border:0;text-align:left;border-radius:20px;padding:14px;color:#fff;box-shadow:var(--shadow);min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:17px;font-family:"Fraunces",serif}
.tile span{font-size:13px;opacity:.92}
.t-daily{background:linear-gradient(135deg,var(--pink),#f0719f)}
.t-mix{background:linear-gradient(135deg,var(--blue),var(--purple))}
.sec{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px;margin:18px 2px 8px}
.lcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
.lcard .em{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--purple-soft);flex:none}
.lcard:nth-child(3n+1) .em{background:var(--pink-soft)}
.lcard:nth-child(3n+2) .em{background:var(--blue-soft)}
.lcard .mid{flex:1;min-width:0}
.lcard h3{font-size:16px;font-family:"Nunito",sans-serif;font-weight:800}
.meta{color:var(--muted);font-size:13px}
.pb{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:7px 0 4px}
.pb>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));border-radius:99px}
.badge{font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;background:var(--purple-soft);color:var(--purple)}
.badge.pink{background:var(--pink-soft);color:var(--pink)}
.soon{border:2px dashed var(--line);border-radius:20px;padding:16px;text-align:center;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;width:100%;margin-top:8px;font-size:16px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:linear-gradient(135deg,var(--blue),var(--purple))}
.btn.small{width:auto;padding:9px 14px;font-size:14px;margin:0}
.back{border:0;background:none;color:var(--purple);font-weight:800;padding:6px 0;margin-bottom:6px;font-size:15px}
ul.rc{margin:8px 0 0;padding-left:20px}
ul.rc li{margin:5px 0}
.part{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qhead .count{font-weight:800;color:var(--muted);font-size:14px;flex:1}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:conic-gradient(var(--pink) var(--deg,360deg),var(--line) 0)}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px}
.ring.low{--deg:60deg;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.qtext{font-size:19px;font-weight:800;margin:10px 0 14px;line-height:1.35}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-weight:600}
.opt .k{flex:none;width:26px;height:26px;border-radius:9px;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:12px 14px;margin:4px 0 8px;background:var(--blue-soft)}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:3px}
.src{font-size:12px;font-weight:800;color:var(--muted);margin-top:6px}
.bigscore{font-family:"Fraunces",serif;font-size:56px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin:6px 0}
.center{text-align:center}
.rev{border-left:5px solid var(--bad);padding-left:12px;margin:12px 0}
.rev p{margin:4px 0}
.warn{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.banner{background:var(--purple-soft);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:13px ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:9;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>document.write('<script src="quiz-data.js?t='+Date.now()+'"><\/script>')</script>
<script>
(function(){
'use strict';
var KEY='nurs251.quiz.progress.v1', TIME=30, PART=40;
var D=window.QUIZ_DATA, app=document.getElementById('app');
if(!D||!D.lessons){app.innerHTML='<div class="card"><h2>Could not load the questions</h2><p>Check that quiz-data.js is uploaded next to index.html, then refresh.</p></div>';return;}

/* ---------- storage ---------- */
var canSave=true, S;
function blank(){return {v:1,theme:'auto',xp:0,streak:{n:0,best:0,last:''},q:{},parts:{},unf:{},daily:''};}
function load(){
  try{var t='__t'+Date.now();localStorage.setItem(t,'1');localStorage.removeItem(t);}catch(e){canSave=false;}
  try{var r=canSave&&localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v)return Object.assign(blank(),o);}}catch(e){}
  return blank();
}
function save(){if(!canSave)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){canSave=false;}}
S=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);}
applyTheme();

/* ---------- data helpers ---------- */
var QB={}, LB={};
D.lessons.forEach(function(L){LB[L.id]=L;L.questions.forEach(function(q){q.L=L.id;QB[q.id]=q;});});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function partsOf(L){var n=L.questions.length,k=Math.max(1,Math.ceil(n/PART)),size=Math.ceil(n/k),out=[];for(var i=0;i<k;i++)out.push(L.questions.slice(i*size,(i+1)*size).map(function(q){return q.id;}));return out;}
function mastered(L){var c=0;L.questions.forEach(function(q){var s=S.q[q.id];if(s&&s.last)c++;});return c;}
function bestOf(L){var b=null;Object.keys(S.parts).forEach(function(k){if(k.indexOf(L.id+':p')===0){var v=S.parts[k].best;if(b===null||v>b)b=v;}});return b;}
var TITLES=[[0,'Student Nurse'],[150,'Ward Helper'],[400,'Staff Nurse'],[800,'Theatre Trainee'],[1400,'Scrub Nurse'],[2200,'Circulating Pro'],[3300,'Senior Sister'],[4700,'Theatre Matron'],[6500,'Surgical Legend']];
function level(){var i=0;for(var k=0;k<TITLES.length;k++)if(S.xp>=TITLES[k][0])i=k;var lo=TITLES[i][0],hi=TITLES[i+1]?TITLES[i+1][0]:lo+1000;return {n:i+1,title:TITLES[i][1],pct:Math.min(100,Math.round((S.xp-lo)/(hi-lo)*100)),next:TITLES[i+1]?TITLES[i+1][1]:null,left:hi-S.xp};}
function weakIds(){return Object.keys(S.q).filter(function(id){var s=S.q[id];return QB[id]&&(!s.last);});}
function streakNow(){var t=today();if(!S.streak.last)return 0;var d=Math.round((new Date(t)-new Date(S.streak.last))/864e5);return d<=1?S.streak.n:0;}
function touchStreak(){var t=today();if(S.streak.last===t)return;var d=S.streak.last?Math.round((new Date(t)-new Date(S.streak.last))/864e5):99;S.streak.n=d===1?S.streak.n+1:1;S.streak.last=t;if(S.streak.n>S.streak.best)S.streak.best=S.streak.n;}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}

/* ---------- router ---------- */
var view={name:'home'}, Q=null, timer=null, deadline=0;
function go(v){stopTimer();view=v;render();window.scrollTo(0,0);}
function render(){({home:home,lesson:lesson,quiz:quiz,result:result,review:review,settings:settings})[view.name]();}
function top(){var lv=level();return '<div class="top"><div class="brand"><div class="logo">🩺</div><div>NURS 251 Quiz<small>Introduction to Surgical Nursing</small></div></div><button class="iconbtn" data-a="settings" aria-label="Settings">⚙️</button></div>';}
function warnHtml(){return canSave?'':'<div class="warn">⚠️ This browser is blocking storage (private mode?). You can still quiz, but your progress will not be saved when you close the page.</div>';}

/* ---------- home ---------- */
function home(){
  var lv=level(), st=streakNow(), total=0,done=0;
  D.lessons.forEach(function(L){total+=L.questions.length;done+=mastered(L);});
  var h=top()+warnHtml();
  h+='<div class="hero"><div class="row"><div><div style="opacity:.9;font-weight:700;font-size:13px">Level '+lv.n+'</div><h2>'+esc(lv.title)+'</h2></div><div class="chip">🔥 '+st+' day'+(st===1?'':'s')+'</div></div>'+
     '<div class="bar"><i style="width:'+lv.pct+'%"></i></div>'+
     '<div class="chips"><span class="chip">⭐ '+S.xp+' XP</span><span class="chip">✅ '+done+'/'+total+' mastered</span>'+(lv.next?'<span class="chip">'+lv.left+' XP to '+esc(lv.next)+'</span>':'')+'</div></div>';
  var keys=Object.keys(S.unf);
  if(keys.length){var k=keys[0],u=S.unf[k];h+='<div class="banner"><div><b>Unfinished quiz</b><div class="meta">'+esc(u.title)+' · question '+(u.i+1)+' of '+u.ids.length+'</div></div><button class="btn small" data-a="resume" data-k="'+esc(k)+'">Resume</button></div>';}
  var weak=weakIds().length, dd=S.daily===today();
  h+='<div class="grid2"><button class="tile t-daily" data-a="daily"><b>Daily check-in</b><span>'+(dd?'Done today ✓ – go again':'10 questions, weak spots first'+(weak?' ('+weak+' to fix)':''))+'</span></button>'+
     '<button class="tile t-mix" data-a="mix"><b>Surprise mix</b><span>20 random questions from every lesson</span></button></div>';
  h+='<div class="sec">Lessons</div>';
  D.lessons.forEach(function(L,i){
    var m=mastered(L),n=L.questions.length,b=bestOf(L),pr=partsOf(L).length;
    h+='<button class="lcard" data-a="lesson" data-id="'+L.id+'"><div class="em">'+L.emoji+'</div><div class="mid"><h3>Lesson '+(i+1)+' · '+esc(L.title)+'</h3><div class="pb"><i style="width:'+Math.round(m/n*100)+'%"></i></div><div class="meta">'+m+'/'+n+' mastered · '+pr+' part'+(pr>1?'s':'')+(b!==null?' · best '+b+'%':'')+'</div></div><span class="badge '+(b!==null&&b>=80?'':'pink')+'">'+(b!==null?b+'%':'New')+'</span></button>';
  });
  app.innerHTML=h;
}

/* ---------- lesson ---------- */
function lesson(){
  var L=LB[view.id],ps=partsOf(L),h='<button class="back" data-a="home">← All lessons</button><h2>'+L.emoji+' '+esc(L.title)+'</h2>';
  h+='<div class="card" style="margin-top:12px"><b>Quick recap</b><ul class="rc">'+L.recap.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="sec">'+(ps.length>1?'Choose a part':'Start')+'</div>';
  ps.forEach(function(ids,i){
    var key=L.id+':p'+(i+1),p=S.parts[key],u=S.unf[key];
    h+='<button class="part" data-a="start" data-k="'+key+'"><div><b>'+(ps.length>1?'Part '+(i+1):'Whole lesson')+'</b><div class="meta">'+ids.length+' questions'+(p?' · best '+p.best+' · tried '+p.att+'×':'')+'</div></div><span class="badge '+(u?'pink':'')+'">'+(u?'Resume':'Start')+'</span></button>';
  });
  var missed=L.questions.filter(function(q){var s=S.q[q.id];return s&&!s.last;}).map(function(q){return q.id;});
  if(missed.length)h+='<button class="btn alt" data-a="retrylesson" data-id="'+L.id+'">Retry the '+missed.length+' I got wrong</button>';
  app.innerHTML=h;
}

/* ---------- quiz engine ---------- */
function newQuiz(key,title,ids,opts){
  var order={};ids.forEach(function(id){order[id]=shuffle([0,1,2,3]);});
  return {key:key,title:title,ids:ids,order:order,i:0,ans:{},rem:TIME,noBest:!!(opts&&opts.noBest),daily:!!(opts&&opts.daily),start:Date.now()};
}
function begin(qz){Q=qz;S.unf[qz.key]=Q;save();view={name:'quiz'};render();window.scrollTo(0,0);}
function startKey(key){
  if(S.unf[key]){Q=S.unf[key];view={name:'quiz'};render();return;}
  var m=key.match(/^(l\d+):p(\d+)$/),L=LB[m[1]],ids=partsOf(L)[+m[2]-1];
  var multi=partsOf(L).length>1;
  begin(newQuiz(key,L.title+(multi?' – Part '+m[2]:''),shuffle(ids)));
}
function startDaily(){
  var key='daily:'+today();
  if(S.unf[key]){Q=S.unf[key];view={name:'quiz'};render();return;}
  var all=Object.keys(QB),weak=shuffle(weakIds()),seen=shuffle(all.filter(function(id){return S.q[id]&&S.q[id].last;})),fresh=shuffle(all.filter(function(id){return !S.q[id];}));
  var pick=weak.slice(0,10);
  fresh.concat(seen).forEach(function(id){if(pick.length<10)pick.push(id);});
  begin(newQuiz(key,'Daily check-in',shuffle(pick),{daily:true,noBest:true}));
}
function startMix(){begin(newQuiz('mix:'+Date.now(),'Surprise mix',shuffle(Object.keys(QB)).slice(0,20),{noBest:true}));}
function retry(ids,title){begin(newQuiz('retry:'+Date.now(),title,shuffle(ids),{noBest:true}));}

function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function ringHtml(){var d=Math.max(0,Q.rem)/TIME*360;return '<div class="ring'+(Q.rem<=8?' low':'')+'" id="ring" style="--deg:'+d+'deg"><span id="rt">'+Math.max(0,Q.rem)+'</span></div>';}
function quiz(){
  if(!Q){go({name:'home'});return;}
  if(Q.i>=Q.ids.length){finish();return;}
  var id=Q.ids[Q.i],q=QB[id],perm=Q.order[id],a=Q.ans[id],h='';
  h+='<div class="qhead"><button class="iconbtn" data-a="leave" aria-label="Save and leave">✕</button><div class="count">'+esc(Q.title)+' · '+(Q.i+1)+'/'+Q.ids.length+'</div>'+ringHtml()+'</div>';
  h+='<div class="pb"><i style="width:'+Math.round(Q.i/Q.ids.length*100)+'%"></i></div>';
  h+='<div class="qtext">'+esc(q.q)+'</div>';
  var right=perm.indexOf(q.a);
  perm.forEach(function(src,k){
    var cls='',dis='';
    if(a){dis=' disabled';if(k===right)cls=' ok';else if(a.pick===k)cls=' bad';}
    h+='<button class="opt'+cls+'"'+dis+' data-a="pick" data-k="'+k+'"><span class="k">'+'ABCD'[k]+'</span><span>'+esc(q.o[src])+'</span></button>';
  });
  if(a){
    var ok=a.ok;
    h+='<div class="fb '+(ok?'ok':'bad')+'"><b>'+(a.pick===-1?'⏰ Time is up':ok?'🎉 Correct!':'Not quite')+'</b>'+esc(q.e)+'<div class="src">From lecture slide '+q.s+' · '+esc(LB[q.L].title)+'</div></div>';
    h+='<button class="btn" data-a="next">'+(Q.i+1>=Q.ids.length?'See results':'Next question →')+'</button>';
  }
  app.innerHTML=h;
  if(!a){startTimer();}
}
function startTimer(){
  stopTimer();deadline=Date.now()+Q.rem*1000;
  timer=setInterval(function(){
    var r=Math.ceil((deadline-Date.now())/1000);if(r<0)r=0;
    if(r!==Q.rem){Q.rem=r;var rt=document.getElementById('rt'),ring=document.getElementById('ring');if(rt)rt.textContent=r;if(ring){ring.style.setProperty('--deg',(r/TIME*360)+'deg');ring.classList.toggle('low',r<=8);}save();}
    if(r<=0)answer(-1);
  },250);
}
function answer(k){
  if(!Q||view.name!=='quiz')return;
  var id=Q.ids[Q.i];if(Q.ans[id])return;
  stopTimer();
  var q=QB[id],perm=Q.order[id],ok=k>=0&&perm[k]===q.a;
  Q.ans[id]={pick:k,ok:ok};
  var s=S.q[id]||(S.q[id]={a:0,c:0,last:0,ts:0});s.a++;if(ok)s.c++;s.last=ok?1:0;s.ts=Date.now();
  if(ok)S.xp+=10;touchStreak();save();render();
}
function next(){Q.i++;Q.rem=TIME;save();render();window.scrollTo(0,0);}
function finish(){
  stopTimer();
  var ids=Q.ids,right=0,missed=[];
  ids.forEach(function(id){if(Q.ans[id]&&Q.ans[id].ok)right++;else missed.push(id);});
  var pct=Math.round(right/ids.length*100),bonus=pct>=90?30:pct>=70?15:0;
  S.xp+=bonus;
  if(!Q.noBest){var p=S.parts[Q.key]||(S.parts[Q.key]={best:0,att:0});p.att++;if(pct>p.best)p.best=pct;}
  if(Q.daily)S.daily=today();
  delete S.unf[Q.key];save();
  var res={title:Q.title,right:right,total:ids.length,pct:pct,missed:missed,bonus:bonus,key:Q.key,qz:Q};
  Q=null;view={name:'result',res:res};render();window.scrollTo(0,0);
}
function result(){
  var r=view.res,msg=r.pct>=90?'Outstanding! 🌟':r.pct>=70?'Great work! 💪':r.pct>=50?'Good effort, keep going 🌱':'Every miss is a lesson. Try the missed ones! 🌸';
  var h='<button class="back" data-a="home">← Home</button><div class="card center"><div class="meta">'+esc(r.title)+'</div><div class="bigscore">'+r.pct+'%</div><b>'+r.right+' of '+r.total+' correct</b><div class="meta" style="margin-top:6px">'+msg+(r.bonus?' · +'+r.bonus+' bonus XP':'')+'</div></div>';
  if(r.missed.length){h+='<button class="btn" data-a="retrymissed">Retry the '+r.missed.length+' I missed</button><button class="btn alt" data-a="review">Review wrong answers</button>';}
  h+='<button class="btn alt" data-a="home">Back to lessons</button>';
  app.innerHTML=h;
}
function review(){
  var r=view.res,h='<button class="back" data-a="backres">← Results</button><h2>Review wrong answers</h2>';
  r.missed.forEach(function(id){
    var q=QB[id],a=r.qz.ans[id],mine=a&&a.pick>=0?q.o[r.qz.order[id][a.pick]]:'No answer (time ran out)';
    h+='<div class="rev"><b>'+esc(q.q)+'</b><p>Your answer: <span style="color:var(--bad);font-weight:700">'+esc(mine)+'</span></p><p>Correct: <span style="color:var(--ok);font-weight:800">'+esc(q.o[q.a])+'</span></p><p class="meta">'+esc(q.e)+' (Slide '+q.s+')</p></div>';
  });
  app.innerHTML=h;
}

/* ---------- settings / backup ---------- */
function settings(){
  var h='<button class="back" data-a="home">← Home</button><h2>Settings</h2>'+warnHtml();
  h+='<div class="card"><b>Appearance</b><div style="display:flex;gap:8px;margin-top:8px"><button class="btn small'+(S.theme==='auto'?'':' alt')+'" data-a="theme" data-t="auto">Auto</button><button class="btn small'+(S.theme==='light'?'':' alt')+'" data-a="theme" data-t="light">Light</button><button class="btn small'+(S.theme==='dark'?'':' alt')+'" data-a="theme" data-t="dark">Dark</button></div></div>';
  h+='<div class="card"><b>Back up my progress</b><div class="meta">Copy this code and paste it on another phone to continue where you stopped.</div><textarea id="bk" readonly>'+esc(makeCode())+'</textarea><button class="btn small" style="margin-top:8px" data-a="copy">Copy code</button></div>';
  h+='<div class="card"><b>Restore from a code</b><textarea id="rs" placeholder="Paste your backup code here"></textarea><button class="btn small blue" style="margin-top:8px" data-a="restore">Restore</button></div>';
  h+='<div class="card"><b>Longest streak</b><div class="meta">'+S.streak.best+' day'+(S.streak.best===1?'':'s')+' 🔥</div><button class="btn alt" data-a="reset">Erase all progress</button></div>';
  app.innerHTML=h;
}
function makeCode(){return 'N251-'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function readCode(c){c=c.trim();if(c.indexOf('N251-')!==0)throw 0;var o=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));if(!o||!o.v||!o.q)throw 0;return Object.assign(blank(),o);}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a;
  if(a==='home')go({name:'home'});
  else if(a==='settings')go({name:'settings'});
  else if(a==='lesson')go({name:'lesson',id:el.dataset.id});
  else if(a==='start')startKey(el.dataset.k);
  else if(a==='resume'){var u=S.unf[el.dataset.k];if(u){Q=u;view={name:'quiz'};render();}}
  else if(a==='daily')startDaily();
  else if(a==='mix')startMix();
  else if(a==='retrylesson'){var L=LB[el.dataset.id];retry(L.questions.filter(function(q){var s=S.q[q.id];return s&&!s.last;}).map(function(q){return q.id;}),L.title+' – missed');}
  else if(a==='pick')answer(+el.dataset.k);
  else if(a==='next')next();
  else if(a==='leave'){stopTimer();save();Q=null;go({name:'home'});}
  else if(a==='retrymissed')retry(view.res.missed,'Retry: missed questions');
  else if(a==='review')go({name:'review',res:view.res});
  else if(a==='backres')go({name:'result',res:view.res});
  else if(a==='theme'){S.theme=el.dataset.t;applyTheme();save();settings();}
  else if(a==='copy'){var t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast('Code copied');},function(){document.execCommand('copy');toast('Code copied');});}catch(x){document.execCommand('copy');toast('Code copied');}}
  else if(a==='restore'){try{var o=readCode(document.getElementById('rs').value);if(confirm('Replace the progress on this phone with the backup?')){S=o;applyTheme();save();toast('Progress restored');go({name:'home'});}}catch(x){toast('That code is not valid');}}
  else if(a==='reset'){if(confirm('Erase all progress on this phone? This cannot be undone.')){S=blank();save();applyTheme();go({name:'home'});}}
});
document.addEventListener('visibilitychange',function(){
  if(view.name!=='quiz'||!Q)return;
  if(document.hidden){if(timer){Q.rem=Math.max(0,Math.ceil((deadline-Date.now())/1000));stopTimer();save();}}
  else if(!Q.ans[Q.ids[Q.i]]){startTimer();}
});
window.addEventListener('pagehide',function(){if(Q&&timer){Q.rem=Math.max(0,Math.ceil((deadline-Date.now())/1000));}save();});
render();
})();
</script>
</body>
</html>
