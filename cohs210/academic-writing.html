<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c4dff">
<title>Academic Writing II Quiz · COHS 210</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff6fb5; --pink-soft:#ffe3f1; --sky:#5ec8ff; --sky-soft:#dff2ff;
  --purple:#a45cf0; --violet:#7c4dff; --royal:#2f55d4; --gold:#f5b82e; --gold-soft:#fff3cf; --navy:#14213d;
  --bg1:#ffe3f1; --bg2:#ffffff; --bg3:#dff2ff;
  --card:#fffffff5; --card-solid:#ffffff; --ink:#14213d; --ink-soft:#56608a; --line:#e6e9f7;
  --good:#1aa76b; --good-bg:#dcf7ea; --bad:#e04a6b; --bad-bg:#ffe1e8;
  --shadow:0 10px 30px rgba(80,70,170,.14); --shadow-sm:0 4px 14px rgba(80,70,170,.10);
  --grad:linear-gradient(135deg,#7c4dff 0%,#2f55d4 55%,#5ec8ff 100%);
  --grad-warm:linear-gradient(135deg,#ff6fb5 0%,#a45cf0 100%);
  --grad-gold:linear-gradient(135deg,#ffd978 0%,#f5b82e 100%);
  --display:'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg1:#1c1450; --bg2:#0e1538; --bg3:#0b1f4a;
  --card:#1a2253f5; --card-solid:#1a2253; --ink:#eef1ff; --ink-soft:#a9b3e6; --line:#2b3678;
  --good:#46d69a; --good-bg:#12392f; --bad:#ff7b95; --bad-bg:#43192a;
  --gold-soft:#3b3112; --pink-soft:#3a1a46; --sky-soft:#12305a;
  --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 4px 14px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg1:#1c1450; --bg2:#0e1538; --bg3:#0b1f4a;
    --card:#1a2253f5; --card-solid:#1a2253; --ink:#eef1ff; --ink-soft:#a9b3e6; --line:#2b3678;
    --good:#46d69a; --good-bg:#12392f; --bad:#ff7b95; --bad-bg:#43192a;
    --gold-soft:#3b3112; --pink-soft:#3a1a46; --sky-soft:#12305a;
    --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%) fixed;
  line-height:1.45;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:'Fredoka','Nunito',system-ui,sans-serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#floaters{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
#floaters span{position:absolute;bottom:-60px;opacity:0;animation:floatUp linear infinite;filter:drop-shadow(0 4px 6px rgba(80,70,170,.18))}
@keyframes floatUp{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.8}85%{opacity:.8}100%{transform:translate(var(--dx),-115vh) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){#floaters{display:none}*{animation:none!important;transition:none!important}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm);padding:16px;backdrop-filter:blur(6px)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--ink-soft)}
.small{font-size:.86rem}
.hidden{display:none!important}

/* header */
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#ffffff55,transparent 70%)}
.hero h1{font-size:1.55rem}
.hero .sub{opacity:.92;font-size:.92rem;margin-top:2px}
.hero .msg{margin-top:10px;background:#ffffff26;border-radius:14px;padding:9px 12px;font-weight:700;font-size:.92rem}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{background:#ffffff2e;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.xpbar{height:8px;border-radius:99px;background:#ffffff33;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--grad-gold);border-radius:99px;transition:width .5s}
.iconbtn{width:40px;height:40px;border-radius:14px;background:#ffffff2e;font-size:1.15rem;color:#fff}
.topbtns{position:absolute;right:14px;top:14px;display:flex;gap:8px;z-index:2}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:800;font-size:1rem;background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(124,77,255,.35);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.warm{background:var(--grad-warm);box-shadow:0 6px 16px rgba(255,111,181,.35)}
.btn.gold{background:var(--grad-gold);color:#4a3600;box-shadow:0 6px 16px rgba(245,184,46,.4)}
.btn.ghost{background:transparent;color:var(--violet);border:2px solid var(--violet);box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sm{padding:9px 13px;font-size:.9rem;border-radius:13px}

/* home tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px;color:#fff;text-align:left;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;min-height:128px}
.tile.daily{background:var(--grad-warm)}
.tile.surprise{background:linear-gradient(135deg,#2f55d4,#5ec8ff)}
.tile .big{font-size:1.9rem}
.tile b{font-family:var(--display);font-size:1.1rem}
.tile span{font-size:.85rem;opacity:.95}
.resume{background:var(--grad-gold);color:#4a3600;border-radius:20px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow-sm)}
.resume b{font-family:var(--display)}

/* lesson cards */
.lesson h3{font-size:1.15rem}
.lesson .ico{width:48px;height:48px;border-radius:16px;background:var(--grad-warm);display:grid;place-items:center;font-size:1.5rem;flex:none}
.lesson:nth-of-type(2n) .ico{background:var(--grad)}
.tag{font-size:.74rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--violet)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--violet),var(--sky));transition:width .5s}
.parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.part{flex:1 1 130px;border-radius:14px;padding:10px 12px;background:var(--sky-soft);text-align:left;border:1px solid var(--line)}
.part b{display:block}
.part small{color:var(--ink-soft)}
.soon{border:2px dashed var(--purple);background:transparent;text-align:center;color:var(--ink-soft)}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{font-weight:800;background:var(--card-solid);border:1px solid var(--line);padding:7px 12px;border-radius:999px}
.timer.low{color:#fff;background:var(--bad);border-color:var(--bad)}
.prog{margin:10px 0 14px}
.qcard{padding:18px;background:var(--card-solid)}
.qtext{font-family:var(--display);font-size:1.18rem;font-weight:600;line-height:1.3}
.slideref{display:inline-block;margin-bottom:8px;font-size:.76rem;font-weight:800;background:var(--gold-soft);color:#8a6200;border-radius:99px;padding:3px 10px}
:root[data-theme="dark"] .slideref{color:#ffd978}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card-solid);font-weight:600;transition:transform .1s,border-color .15s}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:28px;height:28px;border-radius:10px;background:var(--sky-soft);color:var(--royal);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-radius:16px;padding:12px 14px;font-size:.95rem}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb b{font-family:var(--display)}

/* results */
.ring{width:150px;height:150px;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:conic-gradient(var(--violet) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card-solid);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:2rem;display:block;line-height:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:var(--sky-soft);border-radius:14px;padding:10px 4px}
.stat b{font-family:var(--display);font-size:1.3rem;display:block}
.rev{border-left:5px solid var(--bad);border-radius:12px 16px 16px 12px}
.rev.okk{border-left-color:var(--good)}
.rev .you{color:var(--bad);font-weight:700}
.rev .right{color:var(--good);font-weight:700}
ul.recap{padding-left:20px;margin:10px 0}
ul.recap li{margin:8px 0}

/* modal + toast */
.modal{position:fixed;inset:0;background:#0b1230aa;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card-solid);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 18px 28px;max-height:88vh;overflow:auto}
textarea{width:100%;min-height:92px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);padding:10px;font:inherit;font-size:.8rem;word-break:break-all}
.warn{background:var(--gold-soft);border:1px solid var(--gold);color:#6b4b00;border-radius:16px;padding:12px 14px;font-weight:700;font-size:.9rem}
:root[data-theme="dark"] .warn{color:#ffd978}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;z-index:60;box-shadow:var(--shadow)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}
footer{margin-top:18px;text-align:center;font-size:.82rem;color:var(--ink-soft)}
</style>
</head>
<body>
<div id="floaters" aria-hidden="true"></div>
<main id="app"></main>
<script>document.write('<script src="academic-writing-data.js?t='+Date.now()+'"><\/script>')</script>
<script>
(function(){
'use strict';
var KEY='cohs210_academic_writing_ii_v1';
var D=window.QUIZ_DATA;
var app=document.getElementById('app');
var SECS=30, PART=40;
var LEVELS=[[0,'Fresh Intern','🌱'],[150,'Ward Rookie','🩹'],[400,'Care Plan Pro','📋'],[800,'Scientific Scribe','✍️'],[1400,'Research Nurse','🔬'],[2200,'IMRaD Master','🏅'],[3500,'Dr. Wordsmith','🎓'],[5500,'Nightingale of Writing','🕯️']];
var EMOJI=['🩺','💉','💊','🩹','🏥','🧬','🩸','❤️','⚕️','🧪','🔬','📋','🌡️','✨','⭐','👩🏽‍⚕️','👨🏽‍⚕️'];
var MOTIVE=['You are becoming a brilliant nurse-scientist. Keep going! 🌟','Every question you answer makes your writing stronger. 💪','Small steps daily. Big marks later. 🎯','Future nurse, future researcher, future author! 🩺','Revise a little today and thank yourself on exam day. 💜','Clear, accurate, objective: that is you! ✨'];
var canSave=true;

/* ---------- state + storage ---------- */
function def(){return {v:1,xp:0,streak:{n:0,best:0,last:''},attempts:{},best:{},q:{},unfinished:null,theme:'auto',shuffle:false,daily:{},lastMissed:null};}
var S=def();
function load(){
  try{
    var t='__t'+Date.now(); localStorage.setItem(t,'1'); if(localStorage.getItem(t)!=='1') throw 0; localStorage.removeItem(t);
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw); S=merge(def(),o);}
  }catch(e){canSave=false;}
}
function merge(a,b){for(var k in b){a[k]=b[k];}return a;}
function save(){
  if(!canSave) return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){canSave=false;render();}
}
function askPersist(){try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist();}}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
var QMAP={},LMAP={};
function index(){D.lessons.forEach(function(l){LMAP[l.id]=l;l.questions.forEach(function(q){q.lid=l.id;QMAP[q.id]=q;});});}
function partsOf(l){var n=l.questions.length,k=Math.max(1,Math.ceil(n/PART)),size=Math.ceil(n/k),out=[];for(var i=0;i<k;i++){out.push(l.questions.slice(i*size,(i+1)*size));}return out;}
function levelOf(xp){var i=0;for(var k=0;k<LEVELS.length;k++){if(xp>=LEVELS[k][0])i=k;}var cur=LEVELS[i],nxt=LEVELS[i+1];return {i:i,name:cur[1],icon:cur[2],next:nxt?nxt[0]:null,from:cur[0]};}
function mastered(l){var c=0;l.questions.forEach(function(q){var s=S.q[q.id];if(s&&s.last===1)c++;});return c;}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove();},2200);}

/* ---------- floating emojis ---------- */
function floaters(){
  var box=$('floaters');if(!box)return;
  for(var i=0;i<16;i++){
    var s=document.createElement('span');s.textContent=EMOJI[i%EMOJI.length];
    s.style.left=(Math.random()*94)+'%';s.style.fontSize=(18+Math.random()*20)+'px';
    s.style.animationDuration=(16+Math.random()*18)+'s';s.style.animationDelay=(-Math.random()*30)+'s';
    s.style.setProperty('--dx',((Math.random()-.5)*120)+'px');s.style.setProperty('--rot',((Math.random()-.5)*60)+'deg');
    box.appendChild(s);
  }
}

/* ---------- theme ---------- */
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme||'auto');}
function cycleTheme(){var o=['auto','light','dark'];S.theme=o[(o.indexOf(S.theme)+1)%3];applyTheme();save();toast('Theme: '+S.theme);render();}

/* ---------- session ---------- */
var cur=null;            // active quiz session
var view='home';         // home | recap | quiz | results | review
var recapCtx=null, tick=null, lastTick=0;

function startSession(o){
  var ids=o.ids.slice(); if(S.shuffle&&o.kind==='lesson') ids=shuffle(ids);
  cur={kind:o.kind,lid:o.lid||'',part:o.part||0,title:o.title,ids:ids,idx:0,ans:{},remain:ids.length*SECS,total:ids.length*SECS,done:false};
  view='quiz';persistSession();startTimer();render();
}
function persistSession(){S.unfinished=cur&&!cur.done?cur:null;save();}
function startTimer(){
  stopTimer();lastTick=Date.now();
  tick=setInterval(function(){
    if(!cur||view!=='quiz'){return;}
    var now=Date.now(),dt=Math.min(1.5,(now-lastTick)/1000);lastTick=now;
    cur.remain-=dt;
    var t=$('timer');if(t){t.textContent='⏱ '+fmt(cur.remain);t.className='timer'+(cur.remain<=60?' low':'');}
    if(cur.remain<=0){cur.remain=0;finish(true);}
    else if(Math.round(cur.remain)%5===0){persistSession();}
  },1000);
}
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function curQ(){return QMAP[cur.ids[cur.idx]];}

function answer(i){
  var q=curQ();if(!q||cur.ans[q.id]!==undefined)return;
  cur.ans[q.id]=i;
  var st=S.q[q.id]||{seen:0,right:0,wrong:0,last:-1};
  st.seen++;if(i===q.a){st.right++;st.last=1;S.xp+=10;}else{st.wrong++;st.last=0;}
  S.q[q.id]=st;persistSession();render();
}
function next(){
  if(cur.idx<cur.ids.length-1){cur.idx++;persistSession();render();}
  else finish(false);
}
function finish(timeUp){
  stopTimer();
  var correct=0,missed=[],skipped=0;
  cur.ids.forEach(function(id){var q=QMAP[id];var a=cur.ans[id];
    if(a===undefined){skipped++;missed.push(id);} else if(a===q.a)correct++; else missed.push(id);});
  var total=cur.ids.length,pct=Math.round(100*correct/total);
  cur.done=true;cur.result={correct:correct,total:total,pct:pct,missed:missed,skipped:skipped,timeUp:!!timeUp};
  var key=cur.kind==='lesson'?(cur.lid+'p'+(cur.part+1)):cur.kind;
  S.attempts[key]=(S.attempts[key]||0)+1;
  var b=S.best[key];if(!b||pct>b.pct){S.best[key]={pct:pct,correct:correct,total:total};}
  S.xp+=20+(pct>=80?30:0);
  var t=today();
  if(S.streak.last!==t){S.streak.n=(S.streak.last===yesterday())?S.streak.n+1:1;S.streak.last=t;if(S.streak.n>S.streak.best)S.streak.best=S.streak.n;}
  if(cur.kind==='daily'){S.daily[t]=pct;}
  S.lastMissed=missed.length?{title:cur.title,ids:missed}:null;
  S.unfinished=null;save();view='results';render();window.scrollTo(0,0);
}
function quit(){stopTimer();persistSession();cur=null;view='home';render();}
function resume(){if(!S.unfinished)return;cur=S.unfinished;view='quiz';startTimer();render();}

/* daily + surprise */
function startDaily(){
  var all=[];D.lessons.forEach(function(l){all=all.concat(l.questions);});
  var weak=all.filter(function(q){var s=S.q[q.id];return s&&s.last===0;}).sort(function(a,b){return S.q[b.id].wrong-S.q[a.id].wrong;});
  var unseen=shuffle(all.filter(function(q){return !S.q[q.id];}));
  var rest=shuffle(all.filter(function(q){var s=S.q[q.id];return s&&s.last===1;}));
  var pool=weak.concat(unseen).concat(rest).slice(0,10);
  startSession({kind:'daily',title:'Daily check-in',ids:shuffle(pool).map(function(q){return q.id;})});
}
function startSurprise(){
  var all=[];D.lessons.forEach(function(l){all=all.concat(l.questions);});
  startSession({kind:'surprise',title:'Surprise mix',ids:shuffle(all).slice(0,15).map(function(q){return q.id;})});
}

/* ---------- messages ---------- */
function resultMsg(p){
  if(p>=90)return pick(['Outstanding! You are ready for the exam hall! 🏆','Brilliant! That was nurse-scientist level work! 🌟']);
  if(p>=75)return pick(['Great job! A little polish and you will shine. ✨','Strong work! Keep the momentum going. 💜']);
  if(p>=50)return pick(['Good effort! Review the misses and try again. 💪','You are getting there. Every attempt builds mastery. 🌱']);
  return pick(['Do not worry. Every expert started here. Review and retry! 🩹','Learning is a journey. Read the recap and go again! 🌈']);
}

/* ---------- rendering ---------- */
function render(){
  applyTheme();
  if(!D||!D.lessons){app.innerHTML='<div class="card"><h2>Oops</h2><p>The question file could not be loaded. Check that <b>academic-writing-data.js</b> is in the same folder as this page.</p></div>';return;}
  if(view==='home')renderHome();
  else if(view==='recap')renderRecap();
  else if(view==='quiz')renderQuiz();
  else if(view==='results')renderResults();
  else if(view==='review')renderReview();
}

function renderHome(){
  var lv=levelOf(S.xp),pctXp=lv.next?Math.round(100*(S.xp-lv.from)/(lv.next-lv.from)):100;
  var h='<div class="stack pop">';
  h+='<section class="hero"><div class="topbtns"><button class="iconbtn" data-act="theme" aria-label="Change theme">🎨</button><button class="iconbtn" data-act="backup" aria-label="Backup and restore">💾</button></div>';
  h+='<div class="sub">COHS 210 · Academic Writing II</div><h1>Hello, future nurse! 👩🏽‍⚕️</h1>';
  h+='<div class="msg">'+esc(MOTIVE[new Date().getDate()%MOTIVE.length])+'</div>';
  h+='<div class="chips"><span class="chip">🔥 '+S.streak.n+' day streak</span><span class="chip">'+lv.icon+' '+esc(lv.name)+'</span><span class="chip">⭐ '+S.xp+' XP</span></div>';
  h+='<div class="xpbar"><i style="width:'+pctXp+'%"></i></div>';
  h+='<div class="small" style="margin-top:6px;opacity:.9">'+(lv.next?(lv.next-S.xp)+' XP to the next title':'Top title reached!')+'</div></section>';
  if(!canSave)h+='<div class="warn">⚠️ Your browser is blocking saving (private mode?). Your progress will be lost when you close this page. Open the page in a normal tab to keep your scores.</div>';
  if(S.unfinished){var u=S.unfinished;h+='<div class="resume"><div><b>Continue where you stopped</b><div class="small">'+esc(u.title)+' · question '+(u.idx+1)+' of '+u.ids.length+' · '+fmt(u.remain)+' left</div></div><button class="btn sm" data-act="resume">Resume</button></div>';}
  var dd=S.daily[today()];
  h+='<div class="grid2"><button class="tile daily" data-act="daily"><span class="big">📅</span><b>Daily check-in</b><span>'+(dd!==undefined?'Done today: '+dd+'%. Go again!':'10 questions, weak spots first')+'</span></button>';
  h+='<button class="tile surprise" data-act="surprise"><span class="big">🎁</span><b>Surprise mix</b><span>15 random questions from every lesson</span></button></div>';
  h+='<h2 style="margin-top:6px">Your lessons</h2>';
  D.lessons.forEach(function(l){
    var n=l.questions.length,m=mastered(l),pr=partsOf(l),pctM=Math.round(100*m/n);
    var bestAll=0,tries=0;pr.forEach(function(_,i){var k=l.id+'p'+(i+1);if(S.best[k]&&S.best[k].pct>bestAll)bestAll=S.best[k].pct;tries+=S.attempts[k]||0;});
    h+='<article class="card lesson"><div class="row"><div class="ico">'+l.icon+'</div><div style="min-width:0"><div class="tag">Lesson '+l.n+' · '+esc(l.slides)+'</div><h3>'+esc(l.title)+'</h3></div></div>';
    h+='<div class="small muted" style="margin:8px 0">'+esc(l.sub)+'</div>';
    h+='<div class="bar"><i style="width:'+pctM+'%"></i></div>';
    h+='<div class="row between small muted" style="margin-top:6px"><span>'+m+' / '+n+' mastered</span><span>'+(tries?('Best '+bestAll+'% · '+tries+' attempt'+(tries>1?'s':'')):'Not started')+'</span></div>';
    h+='<div class="parts">';
    pr.forEach(function(p,i){var k=l.id+'p'+(i+1),b=S.best[k];
      h+='<button class="part" data-act="lesson" data-l="'+l.id+'" data-p="'+i+'"><b>'+(pr.length>1?'Part '+(i+1):'Start quiz')+'</b><small>'+p.length+' questions · '+fmt(p.length*SECS)+(b?' · best '+b.pct+'%':'')+'</small></button>';});
    h+='</div></article>';
  });
  h+='<article class="card soon"><div style="font-size:1.8rem">🌸</div><h3>More lessons coming</h3><div class="small">When new lecture slides arrive, new lessons will appear here. Your scores and streak stay safe.</div></article>';
  h+='<footer>'+(canSave?'Progress is saved on this phone. Use 💾 to back up.':'Saving is off in this browser.')+'</footer></div>';
  app.innerHTML=h;
}

function renderRecap(){
  var l=LMAP[recapCtx.lid],pr=partsOf(l),p=pr[recapCtx.part];
  var h='<div class="stack pop"><button class="btn ghost sm" data-act="home" style="align-self:flex-start">← Back</button>';
  h+='<section class="card"><div class="tag">Lesson '+l.n+(pr.length>1?' · Part '+(recapCtx.part+1)+' of '+pr.length:'')+'</div><h2 style="margin:4px 0 6px">'+l.icon+' '+esc(l.title)+'</h2>';
  h+='<div class="muted small">Quick recap before you start</div><ul class="recap">';
  l.recap.forEach(function(r){h+='<li>'+esc(r)+'</li>';});
  h+='</ul><div class="statrow"><div class="stat"><b>'+p.length+'</b><span class="small">questions</span></div><div class="stat"><b>'+fmt(p.length*SECS)+'</b><span class="small">time</span></div><div class="stat"><b>4</b><span class="small">options</span></div></div></section>';
  h+='<label class="card row between small"><span><b>Shuffle question order</b><br><span class="muted">Off keeps the slide order</span></span><input type="checkbox" id="shuf" '+(S.shuffle?'checked':'')+' style="width:22px;height:22px"></label>';
  h+='<button class="btn block" data-act="begin">Start ✨</button></div>';
  app.innerHTML=h;
  var c=$('shuf');if(c)c.onchange=function(){S.shuffle=c.checked;save();};
}

function renderQuiz(){
  var q=curQ();if(!q){finish(false);return;}
  var a=cur.ans[q.id],answered=a!==undefined,n=cur.ids.length;
  var h='<div class="stack pop"><div class="qhead"><button class="btn ghost sm" data-act="quit">⏸ Save &amp; exit</button><span id="timer" class="timer'+(cur.remain<=60?' low':'')+'">⏱ '+fmt(cur.remain)+'</span></div>';
  h+='<div><div class="row between small muted"><b>'+esc(cur.title)+'</b><span>'+(cur.idx+1)+' / '+n+'</span></div><div class="bar prog"><i style="width:'+Math.round(100*(cur.idx+(answered?1:0))/n)+'%"></i></div></div>';
  h+='<section class="card qcard"><span class="slideref">📍 Slide '+q.s+' · Lesson '+LMAP[q.lid].n+'</span><div class="qtext">'+esc(q.q)+'</div><div class="opts">';
  q.o.forEach(function(t,i){
    var c='opt';if(answered){if(i===q.a)c+=' correct';else if(i===a)c+=' wrong';else c+=' dim';}
    h+='<button class="'+c+'" data-act="ans" data-i="'+i+'"'+(answered?' disabled':'')+'><span class="k">'+'ABCD'[i]+'</span><span>'+esc(t)+'</span></button>';
  });
  h+='</div>';
  if(answered){var ok=a===q.a;h+='<div class="fb '+(ok?'ok':'no')+'" aria-live="polite"><b>'+(ok?pick(['Correct! 🎉','Yes! 💜','Spot on! ⭐','Well done! 🌟']):'Not quite. 💡')+'</b> '+esc(q.e)+'</div>';}
  h+='</section>';
  if(answered)h+='<button class="btn block '+(cur.idx===n-1?'gold':'')+'" data-act="next">'+(cur.idx===n-1?'See my results 🏁':'Next →')+'</button>';
  h+='</div>';
  app.innerHTML=h;
}

function renderResults(){
  var r=cur.result,h='<div class="stack pop"><section class="card" style="text-align:center">';
  h+='<div class="tag">'+esc(cur.title)+'</div>'+(r.timeUp?'<div class="warn" style="margin:8px 0">⏰ Time is up! '+r.skipped+' unanswered question'+(r.skipped===1?'':'s')+' counted as missed.</div>':'');
  h+='<div class="ring" style="--p:'+r.pct+'"><div><span><b>'+r.pct+'%</b><span class="small muted">'+r.correct+' / '+r.total+'</span></span></div></div>';
  h+='<h2 style="margin:6px 0">'+esc(resultMsg(r.pct))+'</h2>';
  h+='<div class="statrow" style="margin-top:12px"><div class="stat"><b>'+r.correct+'</b><span class="small">right</span></div><div class="stat"><b>'+(r.total-r.correct)+'</b><span class="small">to revisit</span></div><div class="stat"><b>🔥'+S.streak.n+'</b><span class="small">day streak</span></div></div></section>';
  if(r.missed.length)h+='<button class="btn warm block" data-act="retry">🔁 Retry the '+r.missed.length+' I missed</button><button class="btn ghost block" data-act="review">📖 Review wrong answers</button>';
  if(cur.kind==='lesson'){var pr=partsOf(LMAP[cur.lid]);if(cur.part<pr.length-1)h+='<button class="btn block" data-act="nextpart">Next: Part '+(cur.part+2)+' →</button>';
    h+='<button class="btn ghost block" data-act="again">Try this part again</button>';}
  h+='<button class="btn ghost block" data-act="home">🏠 Home</button></div>';
  app.innerHTML=h;
}

function renderReview(){
  var r=cur.result,h='<div class="stack pop"><button class="btn ghost sm" data-act="back2res" style="align-self:flex-start">← Results</button><h2>Review: answers to revisit</h2>';
  if(!r.missed.length)h+='<div class="card">Nothing to review. Perfect round! 🌟</div>';
  r.missed.forEach(function(id,k){var q=QMAP[id],a=cur.ans[id];
    h+='<article class="card rev"><span class="slideref">📍 Slide '+q.s+'</span><div class="qtext" style="font-size:1.02rem">'+(k+1)+'. '+esc(q.q)+'</div>';
    h+='<p class="you">Your answer: '+(a===undefined?'No answer (skipped)':esc(q.o[a]))+'</p><p class="right">Correct: '+esc(q.o[q.a])+'</p><p class="small muted">'+esc(q.e)+'</p></article>';});
  h+='<button class="btn block" data-act="retry"'+(r.missed.length?'':' disabled')+'>🔁 Retry these</button><button class="btn ghost block" data-act="home">🏠 Home</button></div>';
  app.innerHTML=h;window.scrollTo(0,0);
}

/* ---------- backup / restore ---------- */
function makeCode(){try{return 'AW2-'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){return '';}}
function openBackup(){
  var m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML='<div class="sheet stack"><div class="row between"><h2>💾 Backup &amp; restore</h2><button class="btn ghost sm" id="mx">Close</button></div>'+
  '<div class="small muted">Copy this code and keep it safe (WhatsApp it to yourself). Paste it on another phone to continue with the same progress.</div>'+
  '<textarea id="bcode" readonly></textarea><button class="btn" id="bcopy">Copy my backup code</button>'+
  '<div class="small muted" style="margin-top:6px">Restore from a code (this replaces progress on this phone):</div>'+
  '<textarea id="rcode" placeholder="Paste backup code here"></textarea><button class="btn warm" id="rgo">Restore progress</button>'+
  '<button class="btn ghost" id="rst">Reset everything</button></div>';
  document.body.appendChild(m);
  $('bcode').value=makeCode();
  $('mx').onclick=function(){m.remove();};
  m.onclick=function(e){if(e.target===m)m.remove();};
  $('bcopy').onclick=function(){var t=$('bcode');t.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    if(navigator.clipboard){navigator.clipboard.writeText(t.value).then(function(){toast('Copied! 💜');},function(){toast(ok?'Copied! 💜':'Press and hold to copy');});}else toast(ok?'Copied! 💜':'Press and hold to copy');};
  $('rgo').onclick=function(){
    var v=($('rcode').value||'').trim();
    if(v.indexOf('AW2-')!==0){toast('That code does not look right');return;}
    try{var o=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));if(!o||o.v!==1||!o.q)throw 0;
      if(!confirm('Replace the progress on this phone with the backup?'))return;
      S=merge(def(),o);cur=null;view='home';save();m.remove();render();toast('Progress restored ✅');
    }catch(e){toast('Could not read that code');}
  };
  $('rst').onclick=function(){if(confirm('Erase all scores, streak and progress on this phone?')){S=def();cur=null;view='home';save();m.remove();render();toast('Progress reset');}};
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act');
  if(a==='theme')cycleTheme();
  else if(a==='backup')openBackup();
  else if(a==='resume')resume();
  else if(a==='daily')startDaily();
  else if(a==='surprise')startSurprise();
  else if(a==='lesson'){recapCtx={lid:b.getAttribute('data-l'),part:+b.getAttribute('data-p')};view='recap';render();window.scrollTo(0,0);}
  else if(a==='begin')beginLesson(recapCtx.lid,recapCtx.part);
  else if(a==='home'){stopTimer();if(cur&&!cur.done)persistSession();cur=null;view='home';render();window.scrollTo(0,0);}
  else if(a==='quit')quit();
  else if(a==='ans')answer(+b.getAttribute('data-i'));
  else if(a==='next')next();
  else if(a==='retry')retryMissed();
  else if(a==='review'){view='review';render();}
  else if(a==='back2res'){view='results';render();}
  else if(a==='nextpart'){beginLesson(cur.lid,cur.part+1);}
  else if(a==='again'){beginLesson(cur.lid,cur.part);}
});
document.addEventListener('keydown',function(e){
  if(view!=='quiz'||!cur||document.getElementById('modal'))return;
  var k=e.key.toLowerCase(),i='abcd'.indexOf(k);if(i<0&&'1234'.indexOf(k)>=0)i=+k-1;
  if(i>=0&&i<4&&k.length===1){answer(i);}
  else if((k==='enter'||k===' ')&&cur.ans[cur.ids[cur.idx]]!==undefined){e.preventDefault();next();}
});
document.addEventListener('visibilitychange',function(){if(document.hidden&&cur&&!cur.done)persistSession();lastTick=Date.now();});
window.addEventListener('pagehide',function(){if(cur&&!cur.done)persistSession();});

function beginLesson(lid,part){
  var l=LMAP[lid],pr=partsOf(l);
  startSession({kind:'lesson',lid:lid,part:part,title:'Lesson '+l.n+(pr.length>1?' · Part '+(part+1):''),ids:pr[part].map(function(q){return q.id;})});
  window.scrollTo(0,0);
}
function retryMissed(){
  var ids=cur&&cur.result?cur.result.missed:(S.lastMissed?S.lastMissed.ids:[]);if(!ids.length)return;
  startSession({kind:'retry',title:'Retry missed',ids:ids});window.scrollTo(0,0);
}

/* ---------- boot ---------- */
load();askPersist();applyTheme();floaters();
if(D&&D.lessons)index();
render();
})();
</script>
