<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Microbiology Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(160deg,#ffe3f1,#e3f1ff 45%,#ece2ff);--card:rgba(255,255,255,.88);--tx:#1a1f4d;--mu:#5b6190;--pk:#ec4899;--vi:#7c3aed;--ro:#2f4fd8;--sk:#38bdf8;--go:#f5b301;--ok:#16a34a;--bad:#e11d48;--bd:#e6e1fb}
@media(prefers-color-scheme:dark){:root{--bg:linear-gradient(160deg,#0a0f2e,#161050 55%,#240f4a);--card:rgba(28,33,88,.85);--tx:#eef0ff;--mu:#a9b0e6;--bd:#363c8c}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg) fixed;color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;margin:0}
#fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fl span{position:absolute;bottom:-60px;opacity:.35;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
#app{position:relative;z-index:1;max-width:560px;margin:auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(124,58,237,.12);backdrop-filter:blur(6px)}
.hero{background:linear-gradient(135deg,#ec4899,#7c3aed 55%,#2f4fd8);color:#fff;border:0}
.btn{font:700 16px Nunito;border:0;border-radius:16px;padding:14px;width:100%;color:#fff;background:linear-gradient(135deg,var(--vi),var(--ro));cursor:pointer;margin-top:8px}
.btn.pk{background:linear-gradient(135deg,var(--pk),var(--vi))}.btn.go{background:linear-gradient(135deg,#f5b301,#f59e0b);color:#2a1f00}
.btn.gh{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.pill{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-weight:800;margin:4px 4px 0 0}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sk),var(--vi),var(--pk))}
.lc{display:flex;gap:12px;align-items:center;cursor:pointer}.lc .em{font-size:34px}.lc small{color:var(--mu)}
.opt{display:block;width:100%;text-align:left;font:700 16px Nunito;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin:8px 0}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.18)}.opt.no{border-color:var(--bad);background:rgba(225,29,72,.16)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.tm{background:var(--go);color:#2a1f00;border-radius:99px;padding:4px 12px}
.ex{background:rgba(56,189,248,.16);border-radius:14px;padding:12px;margin-top:10px}
.warn{background:#fff3cd;color:#664d03;border-radius:14px;padding:10px;font-weight:700}
textarea{width:100%;height:110px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:8px}
ul{padding-left:20px;line-height:1.5}
</style></head><body>
<div id="fl"></div><div id="app"></div>
<script>document.write('<script src="micro-addo-data.js?t='+Date.now()+'"><\/script>')</script>
<script>
const D=window.QUIZ_DATA,KEY='micro-addo-quiz-v1',PART=40;
function hs(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))>>>0;return x.toString(36)}
const Q={},L={};
D.lessons.forEach(l=>{L[l.id]=l;l.qs=l.questions.map(a=>{const q={q:a[0],o:a[1],a:a[2],e:a[3],s:a[4],l:l.id,id:l.id+'_'+hs(a[0])};Q[q.id]=q;return q})});
let S={},canSave=true,T;
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S=Object.assign({best:{},att:{},stats:{},streak:{n:0,last:''},xp:0,run:null,miss:[]},S);
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){canSave=false}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
addEventListener('pagehide',save);document.addEventListener('visibilitychange',save);
const $app=document.getElementById('app'),td=()=>new Date().toISOString().slice(0,10);
const LV=[[0,'Student Nurse'],[200,'Junior Nurse'],[600,'Staff Nurse'],[1500,'Ward Sister'],[3000,'Consultant']];
const lvl=()=>LV.filter(x=>S.xp>=x[0]).pop()[1];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const em=['🩺','💉','🧬','🔬','💊','🩹','🏥','🦠','👩‍⚕️','🧪','❤️','⭐','🧼','💪'];
const fl=document.getElementById('fl');
em.forEach((e,i)=>{const s=document.createElement('span');s.textContent=e;s.style.left=(i*7.3%95)+'%';s.style.fontSize=(22+i%4*8)+'px';s.style.animationDuration=(14+i%5*4)+'s';s.style.animationDelay=(-i*3)+'s';fl.appendChild(s)});
const msgs=['You are going to be a great nurse! 💖','Every question makes you stronger 💪','Patients will thank you for this ✨','Keep going, future healer! 🌟'];
function warn(){return canSave?'':'<div class="warn">⚠️ Private mode: progress cannot be saved. Open in a normal tab.</div>'}
function home(){clearInterval(T);let h=`<div class="card hero"><h1>🔬 Microbiology Quiz</h1><div>${msgs[Date.now()%4]}</div><span class="pill">🔥 ${S.streak.n} day streak</span><span class="pill">🎓 ${lvl()}</span><span class="pill">⭐ ${S.xp} XP</span></div>${warn()}`;
if(S.run)h+=`<div class="card"><b>Unfinished: ${S.run.title}</b><br><small>${S.run.i}/${S.run.ids.length} done, ${Math.ceil(S.run.left/60)} min left</small><button class="btn go" onclick="quiz()">▶ Resume</button></div>`;
h+=`<div class="row"><button class="btn pk" onclick="daily()">📅 Daily check-in</button><button class="btn" onclick="mix()">🎲 Surprise mix</button></div>`;
D.lessons.forEach(l=>{const b=S.best[l.id]||0,n=S.att[l.id]||0;h+=`<div class="card lc" onclick="lesson('${l.id}')"><div class="em">${l.emoji}</div><div style="flex:1"><h3>${l.title}</h3><small>${l.qs.length} questions · slides ${l.slides} · ${n} tries · best ${b}%</small><div class="bar"><i style="width:${b}%"></i></div></div></div>`});
h+=`<button class="btn gh" onclick="bk()">💾 Backup / restore progress</button>`;
$app.innerHTML=h}
function lesson(id){const l=L[id],parts=Math.ceil(l.qs.length/PART);let h=`<button class="btn gh" onclick="home()">← Back</button><div class="card"><h2>${l.emoji} ${l.title}</h2><b>Quick recap</b><ul>${l.recap.map(r=>`<li>${r}</li>`).join('')}</ul></div>`;
for(let p=0;p<parts;p++){const ids=l.qs.slice(p*PART,(p+1)*PART).map(q=>q.id);h+=`<button class="btn" onclick='go(${JSON.stringify(ids)},"${l.title}${parts>1?' Part '+(p+1):''}","${id}")'>Start ${parts>1?'Part '+(p+1)+' ('+ids.length+' Qs)':'quiz ('+ids.length+' Qs)'}</button>`}
$app.innerHTML=h}
function go(ids,title,lid){S.run={ids,title,lid,i:0,ans:[],left:ids.length*30,ord:ids.map(()=>sh([0,1,2,3]))};save();quiz()}
function weak(q){const s=S.stats[q.id]||[0,0];return s[1]/(s[0]+s[1]+1)+(s[0]+s[1]?0:.3)+Math.random()*.1}
function daily(){const ids=Object.values(Q).sort((a,b)=>weak(b)-weak(a)).slice(0,10).map(q=>q.id);go(ids,'Daily check-in','daily')}
function mix(){go(sh(Object.keys(Q)).slice(0,15),'Surprise mix','mix')}
function quiz(){clearInterval(T);const r=S.run;if(!r)return home();if(r.i>=r.ids.length)return fin();const q=Q[r.ids[r.i]],a=r.ans[r.i],done=a!==undefined;
let h=`<div class="top"><button class="btn gh" style="width:auto;margin:0;padding:6px 12px" onclick="home()">⏸</button><span>Q ${r.i+1}/${r.ids.length}</span><span class="tm" id="tm"></span></div><div class="bar"><i style="width:${r.i/r.ids.length*100}%"></i></div><div class="card"><h3>${q.q}</h3>`;
r.ord[r.i].forEach(k=>{let c='';if(done){if(k==q.a)c='ok';else if(k==a)c='no'}h+=`<button class="opt ${c}" ${done?'disabled':''} onclick="pick(${k})">${q.o[k]}</button>`});
if(done)h+=`<div class="ex">${a==q.a?'✅ Correct!':'❌ Not quite.'} ${q.e}<br><small>📍 Slide ${q.s}</small></div><button class="btn pk" onclick="nx()">Next →</button>`;
$app.innerHTML=h+'</div>';tick();T=setInterval(()=>{r.left--;if(r.left<=0)return fin();if(r.left%5==0)save();tick()},1000)}
function tick(){const e=document.getElementById('tm');if(e){const l=S.run.left;e.textContent='⏱ '+(l/60|0)+':'+String(l%60).padStart(2,'0')}}
function pick(k){const r=S.run,q=Q[r.ids[r.i]];r.ans[r.i]=k;const s=S.stats[q.id]||[0,0];s[k==q.a?0:1]++;S.stats[q.id]=s;save();quiz()}
function nx(){S.run.i++;save();quiz()}
function fin(){clearInterval(T);const r=S.run;let c=0,miss=[];r.ids.forEach((id,i)=>{if(r.ans[i]===Q[id].a)c++;else miss.push(id)});
const p=Math.round(c/r.ids.length*100);if(L[r.lid]){S.best[r.lid]=Math.max(S.best[r.lid]||0,p);S.att[r.lid]=(S.att[r.lid]||0)+1}
S.xp+=c*10;const t=td(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(S.streak.last!=t){S.streak.n=S.streak.last==y?S.streak.n+1:1;S.streak.last=t}
S.miss=miss;S.lastRun={ids:r.ids,ans:r.ans,title:r.title,p,c};S.run=null;save();result()}
function result(){const r=S.lastRun;if(!r)return home();let h=`<div class="card hero" style="text-align:center"><h1>${r.p>=80?'🎉':r.p>=50?'👏':'💪'} ${r.p}%</h1><div>${r.c} of ${r.ids.length} correct · ${r.title}</div><div>+${r.c*10} XP · 🔥 ${S.streak.n} day streak</div></div>`;
if(S.miss.length)h+=`<button class="btn pk" onclick='go(${JSON.stringify(S.miss)},"Retry missed","retry")'>🔁 Retry the ${S.miss.length} I missed</button><button class="btn" onclick="review()">📖 Review wrong answers</button>`;
$app.innerHTML=h+`<button class="btn gh" onclick="home()">🏠 Home</button>`}
function review(){const r=S.lastRun;let h='<button class="btn gh" onclick="result()">← Back</button>';r.ids.forEach((id,i)=>{const q=Q[id];if(r.ans[i]!==q.a)h+=`<div class="card"><b>${q.q}</b><p>✅ ${q.o[q.a]}<br>${r.ans[i]>=0?'❌ You chose: '+q.o[r.ans[i]]:'⏱ Not answered'}</p><div class="ex">${q.e} <small>(Slide ${q.s})</small></div></div>`});$app.innerHTML=h}
function bk(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$app.innerHTML=`<button class="btn gh" onclick="home()">← Back</button><div class="card"><h3>💾 Backup code</h3><small>Copy this and keep it safe.</small><textarea id="bc" readonly>${code}</textarea><button class="btn" onclick="bc.select();document.execCommand('copy')">Copy code</button></div><div class="card"><h3>♻️ Restore</h3><small>Paste a code from another phone.</small><textarea id="rc"></textarea><button class="btn pk" onclick="rs()">Restore</button></div>`}
function rs(){try{const o=JSON.parse(decodeURIComponent(escape(atob(rc.value.trim()))));if(!o.best)throw 0;S=Object.assign(S,o);save();alert('Progress restored ✅');home()}catch(e){alert('That code did not work.')}}
home();
</script></body></html>
