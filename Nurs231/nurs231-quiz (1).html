<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NURS 231 Quiz Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#14224d;--mut:#55608c;--card:rgba(255,255,255,.84);--line:rgba(80,100,200,.2);--pink:#ec5f9f;--sky:#4fb3f6;--pur:#8b5cf6;--roy:#2b50d8;--gold:#f4b52a;--navy:#0d1b4c;--ok:#16a36f;--bad:#e5484d;--bg:linear-gradient(160deg,#ffe1f0,#dff1ff 48%,#e9e1ff)}
html.dk{--ink:#eef1ff;--mut:#aab4e6;--card:rgba(22,34,96,.8);--line:rgba(160,175,255,.22);--bg:linear-gradient(160deg,#0a1240,#14226e 55%,#2a1b6b)}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{position:relative;z-index:1;max-width:560px;margin:auto;padding:16px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:.2em 0;line-height:1.25}
h1{font-size:1.7rem}h2{font-size:1.2rem}small{color:var(--mut);display:block}
.fl{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl span{position:absolute;bottom:-70px;opacity:.38;animation:up linear infinite}
@keyframes up{to{transform:translateY(-120vh) rotate(340deg)}}
@media(prefers-reduced-motion:reduce){.fl{display:none}}
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 8px 24px rgba(43,80,216,.13)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin:8px 0;font:800 1rem Nunito,sans-serif;color:#fff;background:linear-gradient(135deg,var(--pur),var(--roy))}
.btn.p{background:linear-gradient(135deg,var(--pink),var(--pur))}
.btn.g{background:linear-gradient(135deg,var(--gold),#f58f3c);color:var(--navy)}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.x{border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:800 .9rem Nunito}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pur),var(--sky));transition:width .4s}
.les{display:flex;gap:12px;align-items:center;cursor:pointer}.les>div:last-child{flex:1}.em{font-size:2.1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center;padding:10px}.stat b{font-size:1.3rem;display:block}
.qq{font-size:1.15rem;margin:10px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:13px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 .98rem Nunito,sans-serif}
.opt b{color:var(--roy);min-width:1.2em}.opt.ok{border-color:var(--ok);background:rgba(22,163,111,.16)}.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.14)}
.fb{border-radius:16px;padding:12px;margin:10px 0}.okb{background:rgba(22,163,111,.15)}.badb{background:rgba(229,72,77,.13)}.fb p{margin:6px 0}
.warn{background:#fff1c2;color:#6b4e00;border-radius:14px;padding:10px;margin:8px 0;font-weight:700}
.big{font-size:3rem;text-align:center;margin:0}textarea{width:100%;height:110px;border-radius:14px;border:1px solid var(--line);padding:10px;background:var(--card);color:var(--ink);font-size:.8rem}
.gold{color:var(--gold)}
</style></head><body>
<div id="app"></div>
<script>document.write('<script src="quiz-data.js?t='+Date.now()+'"><\/script>')</script>
<script>
const KEY='nurs231_health_assessment_v1',D=window.QUIZ_DATA||{lessons:[]},$=s=>document.querySelector(s),app=$('#app');
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={best:{},att:{},qs:{},streak:{n:0,last:''},xp:0,unf:null,dark:null,lastWrong:[]},canSave=true,R=null,T=null,LR=null;
try{localStorage.setItem(KEY+'_t','1');localStorage.removeItem(KEY+'_t');const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r))}catch(e){canSave=false}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canSave=false}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const Q={},L={};
D.lessons.forEach(l=>{L[l.id]=l;l.ids=l.q.map(x=>{const id=l.id+'_'+hash(x[0]);Q[id]={id,l:l.id,q:x[0],o:x[1],a:x[2],e:x[3],s:x[4]};return id})});
const allIds=Object.keys(Q);
const LV=[[0,'Student Nurse'],[100,'Caring Cadet'],[300,'Skilled Practitioner'],[700,'Clinical Star'],[1500,'Nurse Champion']];
const lvl=()=>{let i=0;LV.forEach((v,k)=>{if(S.xp>=v[0])i=k});return i};
const M=['Every question you answer makes you a safer nurse. 💙','Small steps daily, big healing hands later. 🌸','Your future patients are cheering for you! 🩺','Revise today, shine on the ward tomorrow. ✨','Compassion plus knowledge: that is nursing. 💗','You are closer to your white coat than yesterday. 🏥'];
const day=d=>d.toLocaleDateString('en-CA');
function streak(){const t=day(new Date()),y=day(new Date(Date.now()-864e5));if(S.streak.last===t)return;S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t}
const dark=()=>document.documentElement.classList.toggle('dk',S.dark===null?matchMedia('(prefers-color-scheme:dark)').matches:S.dark);
function toggle(){S.dark=!document.documentElement.classList.contains('dk');save();dark();home()}
const bestOf=l=>{const v=Object.keys(S.best).filter(k=>k.indexOf(l.id+'_p')==0).map(k=>S.best[k]);return v.length?Math.max(...v):null};
function home(){stopT();R=null;const lv=lvl(),nx=LV[lv+1],pc=nx?(S.xp-LV[lv][0])/(nx[0]-LV[lv][0])*100:100,u=S.unf;
app.innerHTML=`${canSave?'':'<div class="warn">⚠️ Your browser is in private mode or blocks storage, so progress cannot be saved. Open this page in a normal tab.</div>'}
<div class="top"><div><h1>🩺 NURS 231</h1><small>Health Assessment Quiz Buddy</small></div><button class="x" onclick="toggle()">🌓</button></div>
<div class="card"><b>${LV[lv][1]} 🎖️</b><div class="bar"><i style="width:${pc}%"></i></div><small>${S.xp} XP${nx?' · next: '+nx[1]+' at '+nx[0]:' · top level!'}</small>
<p style="margin:8px 0 0">${M[new Date().getDate()%M.length]}</p></div>
<div class="g2"><div class="card stat">🔥<b>${S.streak.n}</b><small>day streak</small></div><div class="card stat">⭐<b>${allIds.filter(i=>S.qs[i]&&S.qs[i].c>0).length}/${allIds.length}</b><small>mastered</small></div></div>
${u?`<button class="btn g" onclick="resume()">▶️ Resume: ${esc(u.title)} (${Math.min(u.i+1,u.ids.length)}/${u.ids.length}, ${u.left}s left)</button>`:''}
<div class="g2"><button class="btn p" onclick="daily()">📅 Daily check-in</button><button class="btn" onclick="surprise()">🎲 Surprise mix</button></div>
<h2>Lessons</h2>${D.lessons.map(l=>{const n=l.ids.length,d=l.ids.filter(i=>S.qs[i]&&S.qs[i].c>0).length,b=bestOf(l);return `<div class="card les" onclick="lesson('${l.id}')"><div class="em">${l.emoji}</div><div><b>${esc(l.title)}</b><small>${n} questions · slides ${l.slides}</small><div class="bar"><i style="width:${d/n*100}%"></i></div><small>${d}/${n} mastered · best ${b==null?'–':b+'%'}</small></div></div>`}).join('')}
<div class="card les" style="opacity:.8"><div class="em">💌</div><div><b>More lessons coming</b><small>New slides will appear here soon.</small></div></div>
<button class="btn o" onclick="backup()">💾 Backup / restore progress</button>`}
function lesson(id){const l=L[id],n=l.ids.length,P=Math.ceil(n/40);
app.innerHTML=`<button class="x" onclick="home()">← Home</button><h1>${l.emoji} ${esc(l.title)}</h1><small>Slides ${l.slides} · ${n} questions</small>
<div class="card"><b>📌 Quick recap</b><ul>${l.recap.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`+
Array.from({length:P},(_,p)=>{const k=id+'_p'+p,c=l.ids.slice(p*40,p*40+40).length;return `<button class="btn ${p%2?'p':''}" onclick="go('${id}',${p})">${P>1?'Part '+(p+1)+': ':''}start ${c} questions${S.best[k]!=null?' (best '+S.best[k]+'%)':''}</button>`}).join('')}
function go(id,p){const l=L[id],P=Math.ceil(l.ids.length/40);start(l.title+(P>1?' · Part '+(p+1):''),shuffle(l.ids.slice(p*40,p*40+40)),id+'_p'+p,id)}
function daily(){if(!allIds.length)return;const w=allIds.filter(i=>S.qs[i]&&S.qs[i].w>S.qs[i].c).sort((a,b)=>(S.qs[b].w-S.qs[b].c)-(S.qs[a].w-S.qs[a].c));start('Daily check-in',w.concat(shuffle(allIds.filter(i=>!w.includes(i)))).slice(0,10),null)}
function surprise(){if(allIds.length)start('Surprise mix',shuffle(allIds).slice(0,20),null)}
function start(title,ids,key,lid){R={title,ids,i:0,ans:[],left:30,key,lid};S.unf=R;save();draw()}
function resume(){R=S.unf;if(!R||!R.ids.every(i=>Q[i]))return home();draw()}
function stopT(){clearInterval(T)}
function runT(){stopT();T=setInterval(()=>{R.left--;save();const t=$('#tl');if(t){t.textContent=R.left;$('#tb').style.width=R.left/30*100+'%'}if(R.left<=0)pick(-1)},1000)}
function draw(){if(R.i>=R.ids.length)return finish();const q=Q[R.ids[R.i]],a=R.ans[R.i],done=a!==undefined;
app.innerHTML=`<div class="top"><button class="x" onclick="home()">✕ Pause</button><b>${esc(R.title)}</b><span>${R.i+1}/${R.ids.length}</span></div>
<div class="bar"><i style="width:${R.i/R.ids.length*100}%"></i></div>
<div class="card"><small>⏱️ <b id="tl">${R.left}</b>s left</small><div class="bar"><i id="tb" style="width:${R.left/30*100}%"></i></div>
<h2 class="qq">${esc(q.q)}</h2>${q.o.map((o,j)=>`<button class="opt ${done?(j==q.a?'ok':j==a?'bad':''):''}" ${done?'disabled':''} onclick="pick(${j})"><b>${'ABCD'[j]}</b><span>${esc(o)}</span></button>`).join('')}
${done?`<div class="fb ${a==q.a?'okb':'badb'}"><b>${a==q.a?'🎉 Correct!':a<0?'⏰ Time is up':'💡 Not quite'}</b><p>${esc(q.e)}</p><small>From slide ${q.s}</small></div><button class="btn p" onclick="nxt()">${R.i+1<R.ids.length?'Next question':'See results 🏁'}</button>`:''}</div>`;
if(!done)runT()}
function pick(j){stopT();const q=Q[R.ids[R.i]];R.ans[R.i]=j;const s=S.qs[q.id]||(S.qs[q.id]={s:0,c:0,w:0});s.s++;if(j==q.a){s.c++;S.xp+=10}else s.w++;save();draw()}
function nxt(){R.i++;R.left=30;save();draw()}
function finish(){stopT();const w=R.ids.filter((id,i)=>R.ans[i]!==Q[id].a),n=R.ids.length,c=n-w.length,p=Math.round(c/n*100);
if(R.key){S.best[R.key]=Math.max(S.best[R.key]||0,p);S.att[R.key]=(S.att[R.key]||0)+1}
S.lastWrong=w;S.xp+=5;streak();S.unf=null;save();LR={p,c,n,w,lid:R.lid};results()}
function results(){const{p,c,n,w,lid}=LR;
app.innerHTML=`<p class="big">${p>=80?'🏆':p>=50?'🌟':'💪'}</p><h1 style="text-align:center">${c} / ${n} (${p}%)</h1>
<p style="text-align:center">${p>=80?'Brilliant work, future nurse!':p>=50?'Good progress. Keep going!':'Every miss is a lesson learned. You have this! 💗'}</p>
${w.length?`<button class="btn p" onclick="start('Retry: missed',shuffle(LR.w),null,'${lid||''}')">🔁 Retry the ${w.length} I missed</button><button class="btn" onclick="review()">📖 Review wrong answers</button>`:'<div class="card">🎉 Perfect score. Nothing to review!</div>'}
<button class="btn o" onclick="home()">🏠 Home</button>`}
function review(){app.innerHTML=`<button class="x" onclick="results()">← Results</button><h2>Review</h2>`+LR.w.map(id=>{const q=Q[id];return `<div class="card"><b>${esc(q.q)}</b><p>✅ ${esc(q.o[q.a])}</p><small>${esc(q.e)} (slide ${q.s})</small></div>`}).join('')}
function backup(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
app.innerHTML=`<button class="x" onclick="home()">← Home</button><h2>💾 Backup &amp; restore</h2><div class="card"><b>Your backup code</b><textarea id="bc" readonly>${code}</textarea><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#bc').value);this.textContent='Copied ✔'">Copy code</button></div>
<div class="card"><b>Restore from code</b><textarea id="rc" placeholder="Paste a backup code here"></textarea><button class="btn p" onclick="restore()">Restore progress</button></div>`}
function restore(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#rc').value.trim()))));if(!o.qs)throw 0;S=Object.assign(S,o);save();alert('Progress restored ✔');home()}catch(e){alert('That code is not valid. Copy the whole code and try again.')}}
const fe=document.createElement('div');fe.className='fl';
['🩺','💉','💊','🩹','🧬','🫀','🌡️','🏥','👩‍⚕️','🧑‍⚕️','✨','💙','💗','🩸'].forEach((e,i)=>{const s=document.createElement('span');s.textContent=e;s.style.cssText=`left:${(i*7.3+3)%94}%;font-size:${22+i%4*8}px;animation-duration:${16+i%5*5}s;animation-delay:-${i*2.3}s`;fe.appendChild(s)});document.body.prepend(fe);
dark();if(S.unf&&!S.unf.ids.every(i=>Q[i]))S.unf=null;
if(!allIds.length)app.innerHTML='<div class="warn">quiz-data.js did not load. Upload it next to this page.</div>';else home();
</script></body></html>
